<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>网页版文字转语音</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f5f6f8; color:#222; min-height:100vh; display:flex; flex-direction:column; }
  header { background:#fff; padding:14px 16px; font-size:18px; font-weight:600; border-bottom:1px solid #eee; }
  header span { color:#888; font-size:12px; font-weight:400; margin-left:8px; }
  main { flex:1; padding:16px; display:flex; flex-direction:column; gap:14px; max-width:760px; width:100%; margin:0 auto; }
  textarea { width:100%; min-height:180px; border:1px solid #ddd; border-radius:12px; padding:14px; font-size:16px; line-height:1.6; resize:vertical; background:#fff; outline:none; }
  textarea:focus { border-color:#2d7ff9; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .btn { border:none; border-radius:10px; padding:12px 18px; font-size:16px; font-weight:500; cursor:pointer; flex:1; min-width:0; }
  .btn.primary { background:#2d7ff9; color:#fff; }
  .btn.primary:active { background:#1f66d6; }
  .btn.stop { background:#e5484d; color:#fff; }
  .btn.ghost { background:#fff; color:#333; border:1px solid #ddd; }
  #status { font-size:13px; color:#888; min-height:18px; }
  .voicerow { display:flex; align-items:center; gap:10px; font-size:13px; color:#555; }
  .voicerow select { flex:1; padding:8px; border:1px solid #ddd; border-radius:8px; font-size:14px; background:#fff; }
  footer { text-align:center; padding:12px; font-size:12px; color:#aaa; }
</style>
</head>
<body>
  <header>网页版文字转语音<span>FYH-GITHUB-TTS-TEST</span></header>
  <main>
    <textarea id="txt" placeholder="在这里输入或粘贴你想朗读的文字，然后点右下角按钮播放…"></textarea>
    <div class="toolbar">
      <button class="btn primary" id="play">▶ 播放</button>
      <button class="btn ghost" id="clear">清空</button>
    </div>
    <div class="voicerow">
      音色
      <select id="voice">
        <option value="">自动选择(中文)</option>
      </select>
    </div>
    <div id="status"></div>
  </main>
  <footer>纯前端 · 浏览器自带语音 · 无需联网后端</footer>

<script>
  const txt = document.getElementById('txt');
  const play = document.getElementById('play');
  const clear = document.getElementById('clear');
  const status = document.getElementById('status');
  const voiceSel = document.getElementById('voice');

  function log(m){ status.textContent = m; }
  function syn(){
    try { speechSynthesis.cancel(); speechSynthesis.resume(); } catch(e){}
  }

  // 填充音色下拉
  function loadVoices(){
    const vs = speechSynthesis.getVoices();
    const zh = vs.filter(v => /zh|yue/i.test(v.lang));
    voiceSel.innerHTML = '<option value="">自动选择(中文)</option>';
    (zh.length?zh:vs).forEach(v=>{
      const o=document.createElement('option');
      o.value=v.name; o.textContent=v.name+' ('+v.lang+')';
      voiceSel.appendChild(o);
    });
  }
  if(speechSynthesis.onvoiceschanged!==undefined)
    speechSynthesis.onvoiceschanged=loadVoices;
  loadVoices();

  let speaking=false;
  play.addEventListener('click',()=>{
    const text=txt.value.trim();
    if(!text){ log('请先输入文字'); return; }
    // 手势触发，自动播放合法
    play.classList.add('stop');
    play.textContent='⏸ 停止';
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; u.rate=1; u.pitch=1;
    const vn=voiceSel.value;
    const vs=speechSynthesis.getVoices();
    const v=vn?vs.find(x=>x.name===vn):vs.find(x=>/zh|yue/i.test(x.lang));
    if(v) u.voice=v;
    u.onstart=()=>{ speaking=true; log('正在朗读…'); };
    u.onend=()=>{ speaking=false; play.classList.remove('stop'); play.textContent='▶ 播放'; log('播放结束'); };
    u.onerror=e=>{ speaking=false; play.classList.remove('stop'); play.textContent='▶ 播放'; log('出错:'+ (e&&e.error||'unknown')); };
    syn(); speechSynthesis.speak(u);
  });

  // 切角色/停止逻辑
  play.addEventListener('click',()=>{
    if(speaking){ speechSynthesis.cancel(); speaking=false; play.classList.remove('stop'); play.textContent='▶ 播放'; log('已停止'); }
  });
  clear.addEventListener('click',()=>{ txt.value=''; log('已清空'); });
</script>
</body>
</html>
