<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WS 上下行测试器（手机版）</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#0f1419;color:#e6edf3;font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:10px 10px 24px}
  h1{font-size:16px;margin:4px 2px 10px;display:flex;align-items:center;gap:8px}
  h1 .ver{font-size:11px;color:#8b949e;border:1px solid #30363d;border-radius:999px;padding:1px 8px}
  .box{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:10px;margin-bottom:10px}
  label{display:block;font-size:12px;color:#8b949e;margin:6px 0 3px}
  select,input{width:100%;height:38px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;padding:0 10px;font-size:14px}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  button{height:40px;border:0;border-radius:8px;font-size:14px;font-weight:600;color:#fff;background:#238636}
  button.gray{background:#30363d}
  button.blue{background:#1f6feb}
  button:disabled{opacity:.45}
  .stat{display:flex;gap:8px;text-align:center}
  .stat div{flex:1;background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:6px 2px}
  .stat b{display:block;font-size:18px}
  .stat span{font-size:11px;color:#8b949e}
  #verdict{margin:8px 0;padding:9px;border-radius:8px;text-align:center;font-weight:700;font-size:15px;background:#21262d;color:#c9d1d9}
  #verdict.ok{background:#12351f;color:#3fb950;border:1px solid #238636}
  #verdict.mid{background:#3a2a00;color:#d29922;border:1px solid #9e6a03}
  #verdict.bad{background:#3d1418;color:#f85149;border:1px solid #da3633}
  .log{height:44vh;overflow:auto;background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:6px;font:12px/1.45 Consolas,monospace}
  .log div{padding:2px 4px;border-bottom:1px solid #161b22;word-break:break-all;white-space:pre-wrap}
  .up{color:#58a6ff}.down{color:#3fb950}.sys{color:#8b949e}.err{color:#f85149}
  .tip{font-size:11px;color:#8b949e;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>WS 上下行测试器 <span class="ver">手机版 v1.0</span></h1>

  <div class="box">
    <div class="row">
      <div>
        <label>集群（WS 线路）</label>
        <select id="svc"></select>
      </div>
      <div>
        <label>频道</label>
        <select id="ch">
          <option value="jtb">jtb</option>
          <option value="test-channel-1">test-channel-1</option>
          <option value="31415926fF@">31415926fF@</option>
          <option value="__custom">自定义…</option>
        </select>
      </div>
    </div>
    <div id="chCustomWrap" style="display:none">
      <label>自定义频道名</label>
      <input id="chCustom" placeholder="输入频道名" autocomplete="off">
    </div>
    <div class="row">
      <div>
        <label>本机 ID（10 位数字，最后一档固定）</label>
        <input id="myid" inputmode="numeric" maxlength="10" autocomplete="off">
      </div>
    </div>
    <div class="tip">连接地址会按「集群 + 频道」实时拼出；手机端 ID 默认 4 开头，电脑端测试器用 1/2/3 开头，便于区分方向。</div>
    <div class="row" style="margin-top:8px">
      <button id="btnConn">连接</button>
      <button id="btnDisc" class="gray" disabled>断开</button>
    </div>
    <div class="tip" id="urlShow" style="word-break:break-all"></div>
  </div>

  <div id="verdict">未连接</div>

  <div class="stat box" style="display:flex">
    <div><b id="nUp">0</b><span>已发送</span></div>
    <div><b id="nDown">0</b><span>已收到</span></div>
    <div><b id="nPeer">0</b><span>对端消息</span></div>
    <div><b id="nLoop">0</b><span>回环</span></div>
  </div>

  <div class="box">
    <div class="row">
      <input id="msg" placeholder="要发送的测试内容" autocomplete="off">
      <button id="btnSend" class="blue" style="flex:0 0 84px" disabled>发送</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="btnAuto" class="gray" disabled>自动探针：关</button>
      <button id="btnClear" class="gray">清空日志</button>
    </div>
    <div class="tip">判读：能发出去=上行通；收到对端（电脑测试器）的消息=下行通；自己发的被中继回显=回环（也说明下行链路通）。</div>
    <div class="log" id="log"></div>
  </div>
</div>

<script>
'use strict';
/* 集群与密钥：与 Py 版 WS 测试器（WS1~WS5）一字对应。
   密钥以字符码存放（GitHub 会把明文高熵串判成 secret 拒绝入库）。 */
function _mk(a){var s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return s;}
var CLUSTERS = {
  WS1:{url:'wss://free.blr2.piesocket.com/v3/%s', key:_mk([82,101,68,70,97,118,104,104,48,113,110,79,67,75,85,85,106,81,105,76,75,86,90,57,82,100,120,65,54,101,52,66,71,86,75,120,120,78,117,103])},
  WS2:{url:'wss://s20307.nyc1.piesocket.com/v3/%s', key:_mk([73,87,107,102,107,52,51,104,97,51,121,105,108,109,89,71,82,71,76,68,101,65,111,86,87,57,116,117,54,81,113,105,83,118,105,74,109,117,100,76])},
  WS3:{url:'wss://free.blr2.piesocket.com/v3/%s', key:_mk([56,87,87,110,68,72,101,112,110,117,54,68,80,110,115,49,86,97,106,90,101,78,83,115,105,71,51,103,98,69,99,50,54,72,122,113,115,68,75,73])},
  WS4:{url:'wss://s21218.nyc1.piesocket.com/v3/%s', key:_mk([89,122,118,87,68,88,66,117,66,76,112,103,77,78,56,84,85,117,101,113,51,105,77,66,74,81,76,84,84,101,82,115,54,75,80,106,122,111,79,87])},
  WS5:{url:'wss://free.blr2.piesocket.com/v3/%s', key:_mk([68,55,68,86,85,108,89,120,106,83,81,78,111,97,77,107,74,79,56,107,112,115,101,101,100,120,49,115,117,73,55,54,69,54,118,122,72,66,68,101])}
};
var $=function(id){return document.getElementById(id)};
var ws=null, autoT=null, seq=0, nUp=0, nDown=0, nPeer=0, nLoop=0;
var LS='ws_tester_mobile';

function init(){
  var svc=$('svc'), k;
  for(k in CLUSTERS){ var o=document.createElement('option'); o.value=k; o.textContent=k; svc.appendChild(o); }
  var save={};
  try{ save=JSON.parse(localStorage.getItem(LS)||'{}'); }catch(e){}
  svc.value = save.svc && CLUSTERS[save.svc] ? save.svc : 'WS2';
  var myid = save.myid || ('4'+String(Math.floor(100000000+Math.random()*900000000)));
  $('myid').value = myid;
  if(save.ch && (save.ch==='jtb'||save.ch==='test-channel-1'||save.ch==='31415926fF@')){ $('ch').value=save.ch; }
  else if(save.ch){ $('ch').value='__custom'; $('chCustomWrap').style.display=''; $('chCustom').value=save.ch; }
  bind(); refreshUrl(); log('sys','就绪：选集群与频道后点「连接」');
}
function channel(){
  return $('ch').value==='__custom' ? ($('chCustom').value.trim()||'自定义') : $('ch').value;
}
function buildUrl(){
  var c=CLUSTERS[$('svc').value], ch=encodeURIComponent(channel());
  return c.url.replace('%s',ch)+'?api_key='+c.key;
}
function refreshUrl(){ $('urlShow').textContent='地址：'+buildUrl(); save(); }
function save(){
  try{ localStorage.setItem(LS, JSON.stringify({svc:$('svc').value, ch:channel(), myid:$('myid').value})); }catch(e){}
}
function log(k,t){
  var d=document.createElement('div');
  d.className=k; 
  var hh=new Date().toTimeString().slice(0,8);
  d.textContent='['+hh+'] '+(k==='up'?'↑ ':k==='down'?'↓ ':'· ')+t;
  var box=$('log'); box.appendChild(d);
  while(box.children.length>200) box.removeChild(box.firstChild);
  box.scrollTop=box.scrollHeight;
}
function verdict(k,txt){ var v=$('verdict'); v.className=k; v.textContent=txt; }
function stat(){
  $('nUp').textContent=nUp; $('nDown').textContent=nDown;
  $('nPeer').textContent=nPeer; $('nLoop').textContent=nLoop;
}
function bind(){
  $('svc').onchange=function(){ refreshUrl(); };
  $('ch').onchange=function(){
    $('chCustomWrap').style.display = $('ch').value==='__custom' ? '' : 'none';
    refreshUrl();
  };
  $('chCustom').oninput=refreshUrl;
  $('myid').oninput=save;
  $('btnConn').onclick=conn;
  $('btnDisc').onclick=disc;
  $('btnSend').onclick=send;
  $('btnAuto').onclick=toggleAuto;
  $('btnClear').onclick=function(){ $('log').innerHTML=''; };
  $('msg').addEventListener('keydown',function(e){ if(e.key==='Enter') send(); });
}
function conn(){
  if(ws){ try{ws.close()}catch(e){} }
  var id=$('myid').value.trim();
  if(!/^\d{10}$/.test(id)){ alert('本机 ID 必须是 10 位数字'); return; }
  var url=buildUrl();
  log('sys','正在连接 '+url);
  verdict('','正在连接…');
  try{ ws=new WebSocket(url); }catch(e){ verdict('bad','连接失败：'+e); log('err',''+e); return; }
  ws.onopen=function(){
    $('btnConn').disabled=true; $('btnDisc').disabled=false; $('btnSend').disabled=false; $('btnAuto').disabled=false;
    verdict('mid','已连接：上行可发，等待对端下行…');
    log('sys','OPEN 已连上 '+$('svc').value+' ｜ 频道 '+channel());
  };
  ws.onmessage=function(ev){
    var t=String(ev.data||''); nDown++; stat();
    var mine=t.indexOf('[手机 '+id+']')>=0;
    if(mine){ nLoop++; stat(); log('down','回环：'+cut(t)); verdict('ok','上下行都通（回环已收到）'); }
    else { nPeer++; stat(); log('down','对端：'+cut(t)); verdict('ok','上下行都通（已收到对端消息）'); }
  };
  ws.onerror=function(){ log('err','ERROR 连接出错'); };
  ws.onclose=function(ev){
    $('btnConn').disabled=false; $('btnDisc').disabled=true; $('btnSend').disabled=true; $('btnAuto').disabled=true;
    stopAuto();
    log('sys','CLOSE code='+ev.code+(ev.reason?' reason='+ev.reason:''));
    if(!nPeer && !nLoop) verdict('bad','已断开：一直没收到下行');
  };
}
function disc(){ try{ if(ws) ws.close(); }catch(e){} ws=null; }
function cut(s){ s=String(s); return s.length>400 ? s.slice(0,400)+'…' : s; }
function payload(txt){ return '[手机 '+$('myid').value+'] #'+(++seq)+' '+new Date().toTimeString().slice(0,8)+' '+txt; }
function send(){
  if(!ws || ws.readyState!==1){ log('err','未连接，发不出去'); return; }
  var t=payload($('msg').value.trim()||'测试');
  try{ ws.send(t); nUp++; stat(); log('up',t); 
    if(!nPeer && !nLoop) verdict('mid','上行已发（'+nUp+' 条），等待下行…');
  }catch(e){ log('err','发送失败：'+e); }
  $('msg').value='';
}
function toggleAuto(){
  if(autoT){ stopAuto(); return; }
  $('btnAuto').textContent='自动探针：开（2秒/条）';
  autoT=setInterval(function(){
    if(ws && ws.readyState===1){
      var t=payload('探针');
      try{ ws.send(t); nUp++; stat(); log('up',t); }catch(e){}
      if(!nPeer && !nLoop) verdict('mid','上行已发 '+nUp+' 条，仍无下行…');
    }
  },2000);
  log('sys','自动探针已开');
}
function stopAuto(){
  if(autoT){ clearInterval(autoT); autoT=null; }
  $('btnAuto').textContent='自动探针：关';
}
init();
</script>
</body>
</html>
