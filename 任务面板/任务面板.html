<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="任务面板版本" content="0.25">
<script>
/* v0.16 版本对齐：网页端版本号一升 → 自动清缓存（只留口令）＋自动取新版（免手动 Ctrl+F5）。
   v0.22：白名单加入「任务面板_服务器」（服务器选择属重要登录信息，版本升级不得清掉，
          否则会退回「自动（谁先答算谁）」→ 旧版服务器抢先应答会丢正文）。 */
(function () {
  var 保留键 = { '任务面板_口令': 1, '任务面板_服务器': 1 };   // 白名单：口令 + 服务器选择
  var 版本键 = '任务面板_版本';     // 记录「已见版本」，避免重复清
  var 当前版本 = '';
  try {
    var _mt = document.querySelector('meta[name="任务面板版本"]');
    当前版本 = (_mt && _mt.getAttribute('content') || '').trim();
  } catch (e) { 当前版本 = ''; }
  if (!当前版本) return;            // 无版本标记：一律不动缓存（安全兜底）

  // ① 版本对齐清缓存：已存版本 ≠ 当前版本 → 只保留口令，清其余 任务面板_* 与 sessionStorage
  try {
    if (localStorage.getItem(版本键) !== 当前版本) {
      var _删 = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('任务面板_') === 0 && !保留键[k]) _删.push(k);
      }
      for (var j = 0; j < _删.length; j++) {
        try { localStorage.removeItem(_删[j]); } catch (e) { }
      }
      try { sessionStorage.clear(); } catch (e) { }
      try { localStorage.setItem(版本键, 当前版本); } catch (e) { }
    }
  } catch (e) { /* 隐私模式等：静默跳过，不影响使用 */ }

  // ② 自动取新版（免手动强刷）：取线上 html（绕缓存）比版本，不同则带时间戳重载
  try {
    var _本页 = location.href.split('#')[0];
    var _分隔 = _本页.indexOf('?') === -1 ? '?' : '&';
    fetch(_本页 + _分隔 + '_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var m = /<meta[^>]*name=["']任务面板版本["'][^>]*content=["']([^"']+)["']/i.exec(t);
        var 线上 = m ? m[1].trim() : '';
        if (线上 && 线上 !== 当前版本) {
          location.replace(_本页 + _分隔 + 't=' + Date.now());
        }
      })['catch'](function () { /* 离线/失败：静默跳过，不影响使用 */ });
  } catch (e) { /* 静默跳过 */ }
})();
</script>

  .次钮 { background: #fff; color: #2b5fb0; border-color: #2b5fb0; }
  .小钮 {

  /* 服务器切换（顶栏，与按钮同排）：下拉 + 在线/离线小标 */
  .服务器盒 { display: flex; align-items: center; gap: 6px; font-size: 14px; flex: 1 1 auto; min-width: 0; }

  .服务器态 { font-size: 12px; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .服务器态.在线 { background: #d8f5dc; color: #1a7a2e; }

  /* 右上角「设置」菜单（0.18）：收纳服务器选择 / 口令 / 版本；主页只留网页版版本 */
  .设置钮 { margin-left: auto; }
  .设置面板 {
    position: fixed; top: 96px; right: 12px; z-index: 40; width: min(92vw, 340px);
    background: #fff; color: #222; border: 1px solid #ccd4e0; border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.22); padding: 10px 12px;
  }
  .设置行 { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; }
  .设置行 + .设置行 { border-top: 1px solid #eef1f5; }
  .设置标 { color: #667; width: 52px; flex: 0 0 auto; }
  .设置值 { color: #223; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .设置面板 .服务器选 { max-width: none; flex: 1 1 auto; }
  .设置面板 .服务器态.自动 { background: #e6ecf5; color: #334; }
  /* 主体 */
  main { padding: 12px; }
  .区 { margin-bottom: 18px; }
  .区标题 { font-size: 16px; margin: 6px 2px 10px; color: #333; }
  .计数 { font-size: 13px; color: #667; font-weight: 400; }
  /* 端列表 */
  .端列表 { display: flex; flex-direction: column; gap: 8px; }
  .端项 {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;

  }
  .端项.离线 { opacity: .55; }
  .端名 { font-weight: 700; }
  .端标 { font-size: 12px; color: #667; background: #eef1f5; border-radius: 4px; padding: 1px 6px; }
  .在线标 { font-size: 12px; border-radius: 999px; padding: 1px 8px; }
  .在线标.在线 { background: #d8f5dc; color: #1a7a2e; }
  .在线标.离线 { background: #e4e7ec; color: #77808c; }
  /* 忙闲标签（发布弹窗「选择对话」）：忙＝红 / 闲＝绿 / 未知＝灰 */
  .忙闲标 { font-size: 12px; border-radius: 999px; padding: 1px 8px; margin-left: auto; }
  .忙闲标.忙 { background: #ffe0e0; color: #b00020; }
  .忙闲标.闲 { background: #d8f5dc; color: #1a7a2e; }
  .忙闲标.未知 { background: #e4e7ec; color: #77808c; }
  /* 卡片（用户口径 2026-10-19：宽＝容器满宽；高按内容自适应、上限＝本卡宽度；超出即【截断】；手动展开） */
  /* 宽度取满容器（手机上＝手机宽度、桌面上＝面板列表宽度）；高度 auto（字少即矮），
     max-height 上限＝本卡宽度（由 卡片.js 0.08 渲染后/resize 时贴 = offsetWidth），超出即截断 */
  .任务列表 { display: flex; flex-direction: column; gap: 14px; }
  .卡组 { display: flex; flex-direction: column; gap: 10px; }

    width: 100%; height: auto;

  .卡.展开 { max-height: none; }              /* 手动「展开 ▾」后解除上限、height:auto（内容全见） */
  .卡.主卡 { box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .卡.底蓝 { background: #dceaff; border-color: #b8d0f5; }
  .卡.底绿 { background: #dcf6e1; border-color: #aee0b8; }
  .卡.底黄 { background: #fff3c4; border-color: #edd98a; }
  .卡头 { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(0,0,0,.04); flex-wrap: wrap; flex: 0 0 auto; }
  .编号 { font-weight: 700; color: #2b5fb0; font-size: 14px; }
  .状态钮 { margin-left: auto; font-size: 12px; padding: 3px 9px; min-height: 0; border-radius: 999px; border: 1px solid #c4ccd8; background: #fff; }
  .状态钮.态好 { background: #d8f5dc; border-color: #a9dcb4; color: #1a7a2e; }
  .状态钮.态中 { background: #fff3c4; border-color: #edd98a; color: #8a6d00; }
  .状态钮.态失败 { background: #ffe0e0; border-color: #f0b4b4; color: #b00020; }
  .状态钮.态终 { background: #e4e7ec; border-color: #cfd5de; color: #556; }
  /* 正文框：占满剩余高度；未展开即【截断】（overflow:hidden、不撑高 → 默认无超高卡） */
  .内容 {
    flex: 1 1 auto; min-height: 0; width: 100%; border: 0; background: transparent; resize: none;
    overflow: hidden; font-family: inherit; font-size: 15px; color: #1c2430; padding: 12px;
  }
  .卡.展开 .内容 { flex: 0 0 auto; overflow: visible; }
  /* 按钮排（0.21 用户口径：全部按钮【一排】，不换行、等分卡宽；完整名称见 title 提示） */
  .按钮排 { display: flex; gap: 4px; padding: 0 6px 8px; flex-wrap: nowrap; flex: 0 0 auto; }
  .卡 .按钮排 .小钮 {
    flex: 1 1 0; min-width: 0; font-size: 12px; padding: 5px 2px; min-height: 30px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .按钮排 .小钮.选中 { background: #dceaff; border-color: #2b5fb0; color: #2b5fb0; }
  /* 【AI 回复 (n)】：黑字＝总数；未读＝蓝字；有未读 → 按钮加 .有新（蓝描边） */
  .回复钮 .总 { color: #222; font-weight: 600; }
  .回复钮 .未读 { color: #2b5fb0; font-weight: 700; }
  .回复钮.有新 { border-color: #2b5fb0; box-shadow: inset 0 0 0 1px #2b5fb0; }
  /* 主卡下方【平铺】其全部回复（无嵌套、时间升序） */
  .平铺列 { display: flex; flex-direction: column; gap: 10px; margin-left: 0; }
  .互动树 { padding: 0 10px 12px; }
  .隐藏 { display: none !important; }
  .空样 { color: #889; font-size: 14px; padding: 8px 2px; }
  /* 详情/原卡 展示 */
  .原卡 { margin-top: 8px; background: #f4f6fa; border: 1px dashed #c4ccd8; border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  .原卡 .原头 { font-weight: 700; color: #2b5fb0; margin-bottom: 4px; }
  /* 我来写（紧跟该卡之后；宽同卡、高随内容，不受正方形约束） */
  .我来写 { width: 100%; background: #dceaff; border: 1px solid #b8d0f5; border-radius: 10px; padding: 10px; }
  .我来写头 { font-size: 13px; font-weight: 700; color: #2b5fb0; margin-bottom: 6px; }
  .我来写 textarea {
    width: 100%; font-family: inherit; font-size: 15px; border: 1px solid #b8d0f5;
    border-radius: 8px; padding: 10px; min-height: 64px; background: #fff;
  }
  /* 弹窗 */
  .遮罩 { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .弹窗 { background: #fff; border-radius: 12px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 16px; }
  .弹窗 h3 { margin: 0 0 12px; font-size: 18px; }
  .字段 { display: block; font-size: 14px; color: #556; margin: 12px 0 6px; }
  .弹窗 textarea { width: 100%; font-family: inherit; font-size: 15px; border: 1px solid #c4ccd8; border-radius: 8px; padding: 10px; min-height: 90px; }
  .大类 { display: flex; gap: 10px; }
  .大类钮 { flex: 1; }
  .大类钮.选中 { background: #2b5fb0; color: #fff; border-color: #2b5fb0; }
  .选择框 { display: flex; flex-direction: column; gap: 6px; max-height: 30vh; overflow-y: auto; }
  .选行 { display: flex; align-items: center; gap: 8px; border: 1px solid #dfe4ec; border-radius: 8px; padding: 9px 11px; background: #fafbfd; font-size: 15px; }
  .选行.选中 { border-color: #2b5fb0; background: #dceaff; }
  .选行.禁用 { opacity: .5; }
  .弹窗底 { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  /* 提示条 */
  .提示 { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60;
          background: #1c2430; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: 90vw; }
  /* ===== 0.19 清单流水账：主页清单堆叠 / 清单内页 / 树状子卡 / 呼叫AI ===== */
  /* 顶栏：左【新建】· 中题名+网页版版本 · 右【设置】 */
  #顶栏 .题 { justify-content: flex-start; }
  .题名 { font-size: 17px; font-weight: 700; }
  .新建钮 { background: #fff; color: #2b5fb0; border-color: #fff; font-weight: 700; }
  /* 主页＝顶层容器；一级卡与内层卡同款（见文末 0.20 样式） */
  /* 卡内标题（占两行位置） */
  .卡标题 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;

  .卡副 { font-size: 12px; color: #667; padding: 3px 12px 0; }
  .卡.点卡 .卡标题 { font-size: 14px; }
  .卡.点卡.完成 .卡标题 { text-decoration: line-through; color: #889; }
  /* 树状子卡组：与主卡同构、略缩进略窄 */
  .子卡组 { margin: 8px 0 0 14px; display: flex; flex-direction: column; gap: 8px;
    border-left: 2px solid #e2e8f2; padding-left: 10px; }
  .子卡组 .卡 { background: #fbfcfe; }
  /* 弹窗内的类型按钮组（新建清单） */
  .类型组 { display: flex; gap: 10px; }
  .类型组 .大类钮.选中 { background: #2b5fb0; color: #fff; border-color: #2b5fb0; }
  /* ===== 0.20 唯一卡片 + 递归容器（全层级同一张卡） ===== */
  /* 一级卡（总管清单）稍作强调；其下各层同款、底色略浅 */
  .卡.层1 { border-color: #b9cbe6; box-shadow: 0 2px 6px rgba(43,95,176,.12); }
  .卡.层2, .卡.层3, .卡.层4, .卡.层5, .卡.层6 { background: #fbfcfe; }
  .卡.完成 .卡标题 { text-decoration: line-through; color: #889; }
  /* 标题占两行位置；手动【展开 ▾】后取消截断 */
  .卡.展开 .卡标题 { display: block; overflow: visible; -webkit-line-clamp: unset; }
  /* 正文框（0.21：默认【收起】，点【展开】才展示；展开后 .卡.展开 .正文框 解除隐藏） */
  .正文框 {
    display: none; flex: 0 0 auto; font-size: 14px; color: #1c2430;
    padding: 6px 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.5;
  }
  .卡.展开 .正文框 { display: block; }
  /* 下级页面（0.21 细分＝跳新页面，像进新文件夹） */
  #节点页 .区 { margin-bottom: 0; }
  .节点页头 {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px; margin-bottom: 12px;
    background: #fff; border: 1px solid #dfe4ec; border-radius: 10px; flex-wrap: wrap;
  }
  .节点页题 { font-size: 15px; font-weight: 700; color: #1c2430; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .节点页新建 { margin-left: auto; flex: 0 0 auto; background: #2b5fb0; color: #fff; border-color: #2b5fb0; font-weight: 700; }
  /* 计数：新建时的标题/正文字数 */
  .字计 { font-size: 12px; color: #889; margin: 2px 0 0; text-align: right; }
  .确认文 { font-size: 15px; color: #333; line-height: 1.6; margin: 4px 0 0; }

  @media (min-width: 700px) {
    main { max-width: 760px; margin: 0 auto; }
  }
</style>

<body>
<header id="顶栏">
  <div class="题">
    <button id="按钮_新建" class="小钮 新建钮">新建</button>
    <button id="按钮_返回主页" class="小钮 新建钮">返回主页</button>
    <span class="题名">任务面板</span>
    <span class="版本">v0.25</span>
    <span id="角色" class="角色">连接中…</span>
    <button id="按钮_设置" class="小钮 设置钮">设置</button>
  </div>
</header>
<div id="设置面板" class="设置面板 隐藏">
  <div class="设置行">
    <span class="设置标">版本</span>
    <span class="设置值">网页版 <span id="设置_网页版版本">–</span>　|　服务器 <span id="设置_服务器版本">–</span></span>
  </div>
  <div class="设置行">
    <span class="设置标">服务器</span>
    <select id="服务器_选择" class="服务器选" title="选择只应答你的服务器（自动发现/自动/手动）"></select>
    <span id="服务器_态" class="服务器态 自动">自动</span>
  </div>
  <div class="设置行">
    <span class="设置标">口令</span>
    <button id="按钮_口令" class="小钮">重设口令</button>
  </div>
</div>
<main>
  <!-- 主页＝我的清单：摆一级卡（一本总管清单＝一张完整的卡）。
       点卡上的【细分】＝整页切到该卡的下级页面（见 #节点页），像进入一个新文件夹。 -->
  <section id="主页" class="区">
    <h2 class="区标题">我的清单 <span id="清单计数" class="计数"></span></h2>
    <div id="顶层容器" class="任务列表"><div class="空样">加载中…</div></div>
  </section>

  <!-- 下级页面（0.21 细分＝跳页）：页头可返回上级 / 在本页新建下级；容器里摆同样的卡 -->
  <section id="节点页" class="区 隐藏">
    <div class="节点页头">
      <button id="按钮_返回上级" class="小钮">← 返回上级</button>
      <span id="节点页_题" class="节点页题">—</span>
      <button id="节点页_新建" class="小钮 节点页新建">＋ 新建下级</button>
    </div>
    <div id="节点容器" class="任务列表"><div class="空样">加载中…</div></div>
  </section>
</main>

<!-- 新建清单弹窗（主页左上角【新建】：选类型——当前只有「总管清单」→ 填标题＋正文 → 创建） -->
<div id="新建清单弹窗" class="遮罩 隐藏">
  <div class="弹窗">
    <h3>新建</h3>
    <label class="字段">类型</label>
    <div id="新建_类型" class="类型组">
      <button type="button" class="大类钮 选中" data-类="总管清单">总管清单</button>
    </div>
    <label class="字段" for="新建_标题">标题</label>
    <input id="新建_标题" type="text" autocomplete="off" maxlength="100" placeholder="如：2026-10 家务流水"
           style="width:100%;font-size:16px;border:1px solid #c4ccd8;border-radius:8px;padding:10px;">
    <p id="新建_标题数" class="字计">0/100</p>
    <label class="字段" for="新建_正文">正文</label>
    <textarea id="新建_正文" maxlength="10000" placeholder="补充说明（可留空）"></textarea>
    <p id="新建_正文数" class="字计">0/10000</p>
    <p style="font-size:13px;color:#889;margin:8px 0 0;">创建后自动带上类型名（总管清单）。</p>
    <div class="弹窗底">
      <button id="新建_取消" class="次钮">取消</button>
      <button id="新建_确定" class="主钮">创建</button>
    </div>
  </div>
</div>
<!-- 加卡弹窗：新建任务（清单一层）/ 新建下级（任意层），都要填标题＋正文 -->
<div id="加卡弹窗" class="遮罩 隐藏">
  <div class="弹窗">
    <h3 id="加卡_题">新建任务</h3>
    <label class="字段" for="加卡_标题">标题</label>
    <input id="加卡_标题" type="text" autocomplete="off" maxlength="100" placeholder="一句话说清这张卡要做什么"
           style="width:100%;font-size:16px;border:1px solid #c4ccd8;border-radius:8px;padding:10px;">
    <p id="加卡_标题数" class="字计">0/100</p>
    <label class="字段" for="加卡_正文">正文</label>
    <textarea id="加卡_正文" maxlength="10000" placeholder="补充说明（可留空）"></textarea>
    <p id="加卡_正文数" class="字计">0/10000</p>
    <div class="弹窗底">
      <button id="加卡_取消" class="次钮">取消</button>
      <button id="加卡_确定" class="主钮">确定</button>
    </div>
  </div>
</div>
<!-- 呼叫 AI 弹窗（选端/选对话/终身号，同旧发布弹窗流程） -->
<div id="呼弹窗" class="遮罩 隐藏">
  <div class="弹窗">
    <h3>呼叫 AI 负责本卡片</h3>
    <p style="font-size:13px;color:#556;margin:0 0 6px;">目标卡片：<b id="呼_节点">—</b></p>
    <label class="字段">AI 大类</label>
    <div id="呼_大类" class="大类">
      <button type="button" class="大类钮" data-类="WorkBuddy">WorkBuddy</button>
      <button type="button" class="大类钮" data-类="Trae">Trae</button>
    </div>
    <label class="字段">选择端（该大类下所有可扫描到的端）</label>
    <div id="呼_端" class="选择框"><div class="空样">请先选大类</div></div>
    <label class="字段">选择对话</label>
    <div id="呼_对话" class="选择框"><div class="空样">请先选端</div></div>
    <div class="弹窗底">
      <button id="呼_取消" class="次钮">取消</button>
      <button id="呼_确认" class="主钮">呼叫</button>
    </div>
  </div>
</div>
<!-- 快速备注弹窗（未开始/进行中/已完成/已放弃） -->
<div id="备注弹窗" class="遮罩 隐藏">
  <div class="弹窗">
    <h3>快速备注 · <span id="备注_节点">—</span></h3>
    <div id="备注_组" class="选择框"></div>
    <div class="弹窗底">
      <button id="备注_取消" class="次钮">取消</button>
    </div>
  </div>
</div>
<div id="口令弹窗" class="遮罩 隐藏">
  <div class="弹窗">
    <h3>输入口令</h3>
    <p style="font-size:14px;color:#556;margin:0 0 6px;line-height:1.6;">
      口令用于拼出本面板的专用频道（固定前缀 + 口令），<b>仅本机浏览器缓存</b>、不上传、不写进源码。
    </p>
    <label class="字段" for="口令_输入">口令</label>
    <input id="口令_输入" type="password" autocomplete="off" placeholder="请输入口令"
           style="width:100%;font-size:16px;border:1px solid #c4ccd8;border-radius:8px;padding:10px;">
    <div class="弹窗底">
      <button id="口令_取消" class="次钮">取消</button>
      <button id="口令_确定" class="主钮">进入</button>
    </div>
  </div>
</div>
<div id="提示" class="提示 隐藏"></div>
