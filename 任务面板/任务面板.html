<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="任务面板版本" content="0.53">
<script>
/* v0.16 版本对齐：网页端版本号一升 → 自动清缓存（只留口令）＋自动取新版（免手动 Ctrl+F5）。
   v0.22：白名单加入「任务面板_服务器」（服务器选择属重要登录信息，版本升级不得清掉，
          否则会退回「自动（谁先答算谁）」→ 旧版服务器抢先应答会丢正文）。 */
(function () {
  var 保留键 = { '任务面板_口令': 1, '任务面板_服务器': 1 };   // 白名单：口令 + 服务器选择
  var 版本键 = '任务面板_版本';     // 记录「已见版本」，避免重复清
  var 当前版本 = '';
  try {
    var _mt = document.querySelector('meta[name="任务面板版本"]');
    当前版本 = (_mt && _mt.getAttribute('content') || '').trim();
  } catch (e) { 当前版本 = ''; }
  if (!当前版本) return;            // 无版本标记：一律不动缓存（安全兜底）

  // ① 版本对齐清缓存：已存版本 ≠ 当前版本 → 只保留口令，清其余 任务面板_* 与 sessionStorage
  try {
    if (localStorage.getItem(版本键) !== 当前版本) {
      var _删 = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('任务面板_') === 0 && !保留键[k]) _删.push(k);
      }
      for (var j = 0; j < _删.length; j++) {
        try { localStorage.removeItem(_删[j]); } catch (e) { }
      }
      try { sessionStorage.clear(); } catch (e) { }
      try { localStorage.setItem(版本键, 当前版本); } catch (e) { }
    }
  } catch (e) { /* 隐私模式等：静默跳过，不影响使用 */ }

  // ② 自动取新版（免手动强刷）：取线上 html（绕缓存）比版本，不同则带时间戳重载
  try {
    var _本页 = location.href.split('#')[0];
    var _分隔 = _本页.indexOf('?') === -1 ? '?' : '&';
    fetch(_本页 + _分隔 + '_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var m = /<meta[^>]*name=["']任务面板版本["'][^>]*content=["']([^"']+)["']/i.exec(t);
        var 线上 = m ? m[1].trim() : '';
        if (线上 && 线上 !== 当前版本) {
          location.replace(_本页 + _分隔 + 't=' + Date.now());
        }
      })['catch'](function () { /* 离线/失败：静默跳过，不影响使用 */ });
  } catch (e) { /* 静默跳过 */ }
})();
</script>

    line-height: 1.5; padding: 0; }
  .卡文存 { display: inline-block; margin: 6px 3px 2px; }
  /* 正文里的小绿卡（0.43 起＝**小标题**：一张小标题带一段小正文，点小标题展开/收起）
     一行一张；尾部状态灯可点改。浏览模式下只显示全部小标题。 */
  /* 0.53（用户 2026-10-22 20:19）：小绿卡区域**左侧每层缩 4px、右侧充满**——
     层与层之间的位移只由 `.绿卡小文` 决定（JS 不再加 paddingLeft）：左边框 2px ＋ 左内边距 2px
     ＝4px/层；左右 margin 归零，右侧与正文框右缘齐平。 */
  .绿卡区 { display: flex; flex-direction: column; gap: 4px; margin: 2px 0; }
  .绿卡区.空 { display: none !important; }
  .绿卡夹 { display: block; }
  .绿卡行 { display: flex; align-items: center; gap: 8px; background: #eaf7ee; cursor: pointer;
    border: 1px solid #bfe3cb; border-radius: 8px; padding: 5px 3px; }
  .绿卡箭 { flex: 0 0 auto; font-size: 11px; color: #4a7a5c; transition: transform .15s; }
  .绿卡夹.开 > .绿卡行 .绿卡箭 { transform: rotate(90deg); }
  .绿卡夹.空文 .绿卡箭 { visibility: hidden; }
  /* 0.53：小正文左右不再缩进（margin 归零），左边框 2px ＋ 左内边距 2px＝**4px/层**，
     这 4px 就是下一级的左移量；右侧 padding 归零，子级右缘仍与正文框内容区右缘齐平。 */
  .绿卡小文 { display: none; margin: 2px 0; padding: 4px 0 6px 2px;
    border-left: 2px solid #bfe3cb; font-size: 13px; color: #2c3a33;
    white-space: pre-wrap; word-break: break-word; line-height: 1.55; }
  /* 0.50：**只展开自己的小正文**——必须用子选择器 `>`，否则 `.绿卡夹.开` 会命中全部后代小文，
     一点开就把下面所有层级全打开（实测 v0.49 有此后代选择器串层问题，本轮修掉）。
     0.53：展开后**标题行与小正文连成同一张卡**——同底色（var(--层底)）、同边框（var(--层边)）、
     无垂直空隙（小文 margin-top 归零、上边框 0）、标题行下方两角改直角、小文下方两角 8px；
     左边框 4px 同时充当下一级的缩进（故左内边距归零，4px/层不变）。 */
  .绿卡夹.开 > .绿卡行 { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .绿卡夹.开 > .绿卡小文 { display: block; margin: 0; padding-left: 0;
    background: var(--层底); border: 1px solid var(--层边); border-top-width: 0;
    border-left-width: 4px; border-radius: 0 0 8px 8px; }
  /* 小蓝卡＝超链接卡片：正文里单独写 [[卡号]] 就渲染成这张蓝色小卡，点它跳到那张卡 */
  .小蓝卡 { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px;
    background: #e6f0ff; border: 1px solid #a9c8f2; color: #24528f; cursor: pointer; }
  .小蓝卡:hover { background: #d8e8ff; border-color: #7fb0ea; }
  .绿卡文 { flex: 1 1 auto; min-width: 0; font-size: 13px; color: #245c39; line-height: 1.45;
    word-break: break-word; white-space: pre-wrap; }
  .绿卡灯 { flex: 0 0 auto; font-size: 11px; padding: 2px 8px; min-height: 24px; border-radius: 999px;
    border: 1px solid #b7d6c2; background: #fff; color: #245c39; }
  .绿卡灯.灯未 { background: #fff7e6; border-color: #f0d79b; color: #8a6112; }
  .绿卡灯.灯行 { background: #e8f1ff; border-color: #a9c8f2; color: #24528f; }
  .绿卡灯.灯完 { background: #def3e4; border-color: #8fd0a6; color: #1c6b36; }
  .绿卡灯.灯弃 { background: #f2f3f5; border-color: #d8dbe1; color: #7a828e; }
  /* 0.51：`.绿卡说明` 已删——写法说明改到正文框 placeholder 与卡片 `使用说明` 里 */
  /* 0.48 使用说明＋模范格式：常驻正文区，灰色，进卡片文件，AI 读 JSON 即可照做 */
  .正文说明 { white-space: pre-wrap; word-break: break-word; font-size: 12.5px; line-height: 1.6;
    color: #7d8794; background: #f7f8fa; border: 1px dashed #d5dbe3; border-radius: 8px;
    padding: 8px 9px; margin: 6px 3px 8px; user-select: text; -webkit-user-select: text; }
  /* 0.52（用户 2026-10-22 19:08）：树状清单的 JSON 层级树：层级颜色系统自动赋予，**8 层各不相同**——
     层1 绿 / 层2 蓝 / 层3 紫 / 层4 橙 / 层5 青 / 层6 玫红 / 层7 黄（柠檬）/ 层8 灰蓝；
     **超过 8 层从第 1 色重新循环**（第 9 层＝第 1 色，第 10 层＝第 2 色…）。
     每深一层左侧缩 4px（0.53）；菱形 ◆ 由系统按「有无下级」自动判断，**有下级才显示**（0.53）。
     每套都沿用「浅底＋同色系边框＋深色文字」，8 个色相肉眼可分。 */
  /* 0.53：每层两个 CSS 变量——展开时让小正文与标题行**同底色、同边框**（颜色取自 `.绿卡行.层色N`）；
     `画树层()` 给每个 `.绿卡夹` 已加 `层1`~`层8` 类，两边一一对应。 */
  .绿卡夹.层1 { --层底: #eaf7ee; --层边: #bfe3cb; }
  .绿卡夹.层2 { --层底: #e8f1ff; --层边: #a9c8f2; }
  .绿卡夹.层3 { --层底: #f2ebff; --层边: #cbb6f2; }
  .绿卡夹.层4 { --层底: #fff2e2; --层边: #f0c9a0; }
  .绿卡夹.层5 { --层底: #e6f7f6; --层边: #a5ded9; }
  .绿卡夹.层6 { --层底: #ffe9f1; --层边: #f2b0c8; }
  .绿卡夹.层7 { --层底: #fdfae0; --层边: #e4d783; }
  .绿卡夹.层8 { --层底: #eceff7; --层边: #bcc5dc; }
  .层图 { flex: 0 0 auto; font-size: 10px; color: #1c6b36; }
  .绿卡行.层色1 { background: #eaf7ee; border-color: #bfe3cb; }
  .绿卡行.层色1 .绿卡文 { color: #245c39; }
  .绿卡行.层色2 { background: #e8f1ff; border-color: #a9c8f2; }
  .绿卡行.层色2 .绿卡文 { color: #24528f; }
  .绿卡行.层色3 { background: #f2ebff; border-color: #cbb6f2; }
  .绿卡行.层色3 .绿卡文 { color: #5a3a8f; }
  .绿卡行.层色4 { background: #fff2e2; border-color: #f0c9a0; }
  .绿卡行.层色4 .绿卡文 { color: #7a4e0a; }
  .绿卡行.层色5 { background: #e6f7f6; border-color: #a5ded9; }
  .绿卡行.层色5 .绿卡文 { color: #0c615c; }
  /* 0.52 新增：层6 玫红 / 层7 黄（柠檬）/ 层8 灰蓝——与前 5 层两两不同 */
  .绿卡行.层色6 { background: #ffe9f1; border-color: #f2b0c8; }
  .绿卡行.层色6 .绿卡文 { color: #97234f; }
  .绿卡行.层色7 { background: #fdfae0; border-color: #e4d783; }
  .绿卡行.层色7 .绿卡文 { color: #6b5b04; }
  .绿卡行.层色8 { background: #eceff7; border-color: #bcc5dc; }
  .绿卡行.层色8 .绿卡文 { color: #3c4766; }
  /* 0.50：子级容器只留上间距，左右一律不加 margin/padding（右侧充满、左侧靠竖线）。
     0.53：展开的小正文带 1px 右边框，右内边距已归零 → 子容器右移 1px 补回，保证**各层右缘齐平**。
     展开一条＝只见它的小正文＋下一级标题，下一级默认闭合（无 .开），再下一级不展开。 */
  .绿卡子 { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; margin-right: -1px; }
  /* 0.50：小正文文字离竖线 3px——只推文字，不增加任何层级位移。 */
  .绿卡正文 { white-space: pre-wrap; word-break: break-word; padding-left: 3px; }
  /* 0.46 流水账（用户 2026-10-22 口径）：小标题行按键＝状态灯＋【编】＋【删】；
     「允许修改历史流水账」勾选框（默认勾选）；勾着才显示编/删。 */
  .绿卡钮 { flex: 0 0 auto; font-size: 11px; padding: 2px 7px; min-height: 24px; border-radius: 999px;
    border: 1px solid #b7d6c2; background: #fff; color: #245c39; }
  .绿卡钮.删 { border-color: #f0b4b4; background: #fff5f5; color: #b00020; }
  /* 0.47 转细分卡：这条连同全部下级整棵子树搬成一张新细分卡（蓝调，与【编】【删】同尺寸） */
  .绿卡钮.转 { border-color: #a9c8f2; background: #eef4ff; color: #24528f; }
  .流水开关 { display: flex; align-items: center; gap: 6px; flex-basis: 100%;
    font-size: 12px; color: #245c39; margin-top: 2px; }
  .流水开关 input { width: 16px; height: 16px; }
  /* 追评区（流水账的「编辑」模式）：每条＝小标题（≤60 字）＋小正文（≤500 字） */
  .追区 { margin: 6px 3px 4px; border-top: 1px dashed #e2e8f2; padding-top: 6px; }
  .追题 { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 14px;
    border: 1px solid #c4ccd8; border-radius: 8px; padding: 8px 3px; }
  .追文 { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 14px;
    border: 1px solid #c4ccd8; border-radius: 8px; padding: 8px 3px; min-height: 80px; resize: vertical; }
  .追计 { display: block; text-align: right; font-size: 11px; color: #889; margin: 2px 0 6px; }
  .追计.超 { color: #c0392b; font-weight: 700; }
  .追存 { display: inline-block; }
  /* 没 AI 负责时，回复两框收起成一条「展开 AI 回复框」；有 AI 则保持展开 */
  .AI回复盒 { display: none; }
  .AI回复盒.开 { display: block; }
  .AI折条 { display: block; width: 100%; margin: 6px 0 2px; padding: 6px 3px; text-align: left;
    font-size: 12px; background: #f4f7fb; border: 1px dashed #c9d6e6; border-radius: 8px; color: #2b5fb0; }
  /* 展开后的 AI 指派区 + 回复窗口（用户 2026-10-21 口径）：只在该卡展开时显示 */
  .AI区 { display: none; margin: 8px 3px 4px; border-top: 1px dashed #e2e8f2; padding-top: 6px; }
  .卡.展开 .AI区 { display: block; }
  .AI题 { font-size: 12px; font-weight: 700; color: #2b5fb0; margin: 8px 0 4px; }
  .AI行 { display: flex; gap: 8px; font-size: 12px; line-height: 1.6; }
  .AI名 { flex: 0 0 112px; color: #889; }
  .AI值 { flex: 1 1 auto; color: #1c2430; word-break: break-word; }
  .AI块 { margin: 4px 0 6px; background: #fafbfd; border: 1px solid #e6eaf2; border-radius: 8px; padding: 6px 3px; }
  .AI块 .AI名 { margin-bottom: 2px; }
  .AI块 .AI值 { white-space: pre-wrap; }
  .AI输 { width: 100%; font-family: inherit; font-size: 14px; border: 1px solid #c4ccd8;
    border-radius: 8px; padding: 8px 3px; min-height: 64px; }
  .AI输长 { min-height: 120px; }
  .AI计 { display: block; text-align: right; font-size: 11px; color: #889; margin: 2px 0 6px; }
  .AI提 { display: block; margin: 6px 0 2px; }
  /* 详情页等弹窗：底部按钮【恒定显示】（滚动不带走） */
  .弹窗底 { position: sticky; bottom: -16px; margin-top: 16px; padding: 10px 0;
    background: #fff; box-shadow: 0 -6px 10px rgba(0,0,0,.05); }
  .确认文 { font-size: 15px; color: #333; line-height: 1.6; margin: 4px 0 0; }
  /* 卡片宽＝容器 100%，窄屏自然随视口收窄，不再需要 --卡边长 兜底 */
  @media (min-width: 700px) {
    main { max-width: 760px; margin: 0 auto; }
  }
</style>
</head>
<body>
<header id="顶栏">
  <div class="题">
    <button id="按钮_新建" class="小钮 新建钮">新建</button>
    <button id="按钮_返回主页" class="小钮 新建钮">返回主页</button>
    <span class="题名">任务面板</span>
    <span class="版本">v0.53</span>
    <span id="角色" class="角色">连接中…</span>
    <button id="按钮_设置" class="小钮 设置钮">设置</button>
  </div>
</header>
<div id="设置面板" class="设置面板 隐藏">
  <div class="设置行">
    <span class="设置标">版本</span>
    <span class="设置值">网页版 <span id="设置_网页版版本">–</span>　|　服务器 <span id="设置_服务器版本">–</span></span>
  </div>
  <div class="设置行">
    <span class="设置标">服务器</span>
    <select id="服务器_选择" class="服务器选" title="选择只应答你的服务器（自动发现/自动/手动）"></select>
    <span id="服务器_态" class="服务器态 自动">自动</span>
  </div>
  <div class="设置行">
    <span class="设置标">口令</span>
    <button id="按钮_口令" class="小钮">重设口令</button>
  </div>
</div>
<main>
  <!-- 主页＝我的清单：摆一级卡（一本总管清单＝一张完整的卡）。
       点卡上的【细分】＝整页切到该卡的下级页面（见 #节点页），像进入一个新文件夹。 -->
  <section id="主页" class="区">
    <h2 class="区标题">我的清单 <span id="清单计数" class="计数"></span>
      <span id="清单分页" class="分页签组">
        <button type="button" class="分页签" data-页="普通">普通</button>
        <button type="button" class="分页签" data-页="系统">系统</button>
        <button type="button" class="分页签 选中" data-页="全部">全部</button>
        <button type="button" class="分页签" data-页="流水清单">流水清单</button>
      </span>
    </h2>
    <div id="顶层容器" class="任务列表"><div class="空样">加载中…</div></div>
  </section>

  <!-- 下级页面（0.21 细分＝跳页）：页头可返回上级 / 在本页新建下级；容器里摆同样的卡 -->
  <section id="节点页" class="区 隐藏">
    <div class="节点页头">
      <button id="按钮_返回上级" class="小钮">← 返回上级</button>
      <span id="节点页_题" class="节点页题">—</span>
      <button id="节点页_新建" class="小钮 节点页新建">＋ 新建下级</button>
    </div>
    <div id="节点容器" class="任务列表"><div class="空样">加载中…</div></div>
  </section>
</main>

<!-- 新建清单弹窗（主页左上角【新建】：选类型——当前只有「总管清单」→ 填标题＋正文 → 创建） -->
<div id="新建清单弹窗" class="遮罩 隐藏">
  <div class="弹窗">
    <h3>新建</h3>
    <label class="字段">类型</label>
    <div id="新建_类型" class="类型组">
      <button type="button" class="大类钮 选中" data-类="树状清单">树状清单</button>
      <button type="button" class="大类钮" data-类="系统清单">系统清单</button>
      <button type="button" class="大类钮" data-类="流水清单">流水清单</button>
    </div>
    <label class="字段" for="新建_标题">标题（≤60 字）</label>
    <input id="新建_标题" type="text" autocomplete="off" maxlength="60" placeholder="如：2026-10 家务流水"
           style="width:100%;font-size:16px;border:1px solid #c4ccd8;border-radius:8px;padding:10px;">
    <p id="新建_标题数" class="字计">0/60</p>
    <label class="字段" for="新建_大白话">清单正文大白话（≤500 字，可在卡片上朗读）</label>
    <textarea id="新建_大白话" maxlength="500" placeholder="用日常话讲清这张卡要干什么"></textarea>
    <p id="新建_大白话数" class="字计">0/500</p>
    <label class="字段" for="新建_正文" id="新建_正文题">清单正文（推荐 ≤1500 字，上限 1 万字）</label>
    <textarea id="新建_正文" maxlength="10000" placeholder="细节、附件说明等（可留空）"></textarea>
    <p id="新建_正文数" class="字计">0/10000</p>
    <p id="新建_提示" style="font-size:13px;color:#889;margin:8px 0 0;">创建后自动带上类型名（树状清单）。</p>
    <div class="弹窗底">
      <button id="新建_取消" class="次钮">取消</button>
      <button id="新建_确定" class="主钮">创建</button>
    </div>
  </div>
</div>
<!-- 加卡弹窗：新建任务（清单一层）/ 新建下级（任意层），都要填标题＋正文 -->
<div id="加卡弹窗" class="遮罩 隐藏">
  <div class="弹窗">
    <h3 id="加卡_题">新建任务</h3>
    <label class="字段" for="加卡_标题">标题（≤60 字）</label>
    <input id="加卡_标题" type="text" autocomplete="off" maxlength="60" placeholder="一句话说清这张卡要做什么"
           style="width:100%;font-size:16px;border:1px solid #c4ccd8;border-radius:8px;padding:10px;">
    <p id="加卡_标题数" class="字计">0/60</p>
    <label class="字段" for="加卡_大白话">清单正文大白话（≤500 字，可在卡片上朗读）</label>
    <textarea id="加卡_大白话" maxlength="500" placeholder="用日常话讲清这张卡要干什么"></textarea>
    <p id="加卡_大白话数" class="字计">0/500</p>
    <label class="字段" for="加卡_正文" id="加卡_正文题">清单正文（推荐 ≤1500 字，上限 1 万字）</label>
    <textarea id="加卡_正文" maxlength="10000" placeholder="细节、附件说明等（可留空）"></textarea>
    <p id="加卡_正文数" class="字计">0/10000</p>
    <div class="弹窗底">
      <button id="加卡_取消" class="次钮">取消</button>
      <button id="加卡_确定" class="主钮">确定</button>
    </div>
  </div>
</div>
<!-- 段落编辑弹窗（0.46）：改某一条小标题＋它的那段小正文（流水账小正文 ≤500 字） -->
<div id="段弹窗" class="遮罩 隐藏">
  <div class="弹窗">
    <h3>编辑这一段</h3>
    <label class="字段" for="段_标题">小标题（≤60 字）</label>
    <input id="段_标题" type="text" autocomplete="off" maxlength="60"
           style="width:100%;font-size:16px;border:1px solid #c4ccd8;border-radius:8px;padding:10px;">
    <p id="段_标题数" class="字计">0/60</p>
    <label class="字段" for="段_正文" id="段_正文题">小正文（≤500 字）</label>
    <textarea id="段_正文" maxlength="500"></textarea>
    <p id="段_正文数" class="字计">0/500</p>
    <div class="弹窗底">
      <button id="段_取消" class="次钮">取消</button>
      <button id="段_确定" class="主钮">保存</button>
    </div>
  </div>
</div>
<!-- 呼叫 AI 弹窗（选端/选对话/终身号，同旧发布弹窗流程） -->
<div id="呼弹窗" class="遮罩 隐藏">
  <div class="弹窗">
    <h3>呼叫 AI 负责本卡片</h3>
    <p style="font-size:13px;color:#556;margin:0 0 6px;">目标卡片：<b id="呼_节点">—</b></p>
    <label class="字段">AI 大类</label>
    <div id="呼_大类" class="大类">
      <button type="button" class="大类钮" data-类="WorkBuddy">WorkBuddy</button>
      <button type="button" class="大类钮" data-类="Trae">Trae</button>
    </div>
    <label class="字段">选择端（该大类下所有可扫描到的端）</label>
    <div id="呼_端" class="选择框"><div class="空样">请先选大类</div></div>
    <label class="字段">选择对话</label>
    <div id="呼_对话" class="选择框"><div class="空样">请先选端</div></div>
    <div class="弹窗底">
      <button id="呼_取消" class="次钮">取消</button>
      <button id="呼_确认" class="主钮">呼叫</button>
    </div>
  </div>
</div>
<!-- 快速备注弹窗（未开始/进行中/已完成/已放弃） -->
<div id="备注弹窗" class="遮罩 隐藏">
  <div class="弹窗">
    <h3>快速备注 · <span id="备注_节点">—</span></h3>
    <div id="备注_组" class="选择框"></div>
    <div class="弹窗底">
      <button id="备注_取消" class="次钮">取消</button>
    </div>
  </div>
</div>
<div id="口令弹窗" class="遮罩 隐藏">
  <div class="弹窗">
    <h3>输入口令</h3>
    <p style="font-size:14px;color:#556;margin:0 0 6px;line-height:1.6;">
      口令用于拼出本面板的专用频道（固定前缀 + 口令），<b>仅本机浏览器缓存</b>、不上传、不写进源码。
    </p>
    <label class="字段" for="口令_输入">口令</label>
    <input id="口令_输入" type="password" autocomplete="off" placeholder="请输入口令"
           style="width:100%;font-size:16px;border:1px solid #c4ccd8;border-radius:8px;padding:10px;">
    <div class="弹窗底">
      <button id="口令_取消" class="次钮">取消</button>
      <button id="口令_确定" class="主钮">进入</button>
    </div>
  </div>
</div>
<div id="提示" class="提示 隐藏"></div>
