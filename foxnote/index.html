<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="网页版版本" content="1.00">
<title>Fox记事本 v1.00</title>
<!--
  Fox记事本 · 网页版 1.00
  纯静态单文件；正文只存云端金山表格，不落本地磁盘。
  部署：FOXFYH/gittest / foxnote / https://foxfyh.github.io/gittest/foxnote/
  更新：2026-10-22
-->
<style>
  :root{
    --blue:#4A90D9; --blue-d:#2c6fbb; --blue-bg:#eaf2fc; --line:#e6e9ee;
    --txt:#222; --sub:#777; --bg:#f4f6f9; --danger:#e74c3c; --green:#1e8449;
    --radius:5px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;display:flex;flex-direction:column;height:100dvh;overflow:hidden;
    background:var(--bg);color:var(--txt);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  /* 顶栏 */
  .top{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;
    background:#fff;border-bottom:1px solid var(--line);
  }
  .logo{
    width:26px;height:26px;border-radius:6px;background:var(--blue);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;
  }
  .title{font-size:16px;font-weight:600;letter-spacing:.5px}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .ver-badge{
    font-size:11px;color:var(--blue);background:var(--blue-bg);
    border:1px solid #cfe0f7;border-radius:8px;padding:2px 7px;white-space:nowrap;
  }
  .icon-btn{
    width:36px;height:36px;border:1px solid #d5dbe3;border-radius:var(--radius);
    background:#fff;color:#555;font-size:17px;line-height:1;cursor:pointer;
  }
  .icon-btn:active{background:#f0f3f7}
  /* 工具栏：一行放不下自动换行 */
  .toolbar{
    flex:0 0 auto;display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px;
    background:#fff;border-bottom:1px solid var(--line);
  }
  .toolbar button{
    flex:1 1 0;min-width:68px;min-height:40px;padding:0 12px;
    border:1px solid #cbd3dd;border-radius:var(--radius);background:#fff;
    color:#333;font:600 14px/1.2 inherit;cursor:pointer;transition:background .12s;
  }
  .toolbar button:active{background:#eef2f7}
  .toolbar button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .toolbar button.primary:active{background:var(--blue-d)}
  .toolbar button.danger{color:var(--danger);border-color:#f0c0bb}
  .toolbar button.danger:active{background:#fdf0ef}
  .toolbar button:disabled{
    background:#f2f3f5;color:#aaa;border-color:#e3e6ea;cursor:not-allowed;
  }
  /* 主体 */
  main{
    flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    width:100%;max-width:1000px;margin:0 auto;background:#fff;
    box-shadow:0 0 0 1px var(--line);
  }
  .panel-head{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:6px 12px;font-size:12px;color:var(--sub);background:#fafbfc;
    border-bottom:1px solid var(--line);
  }
  .count{font-size:11px;color:#999}
  .list-panel{
    flex:0 0 32%;min-height:104px;max-height:42vh;display:flex;flex-direction:column;
    border-bottom:1px solid var(--line);background:#fff;
  }
  .file-list{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain}
  .file-list::-webkit-scrollbar,textarea::-webkit-scrollbar{width:5px;height:5px}
  .file-list::-webkit-scrollbar-thumb,textarea::-webkit-scrollbar-thumb{background:#c8ced6;border-radius:3px}
  .file-item{
    display:flex;align-items:center;gap:8px;min-height:52px;padding:8px 12px;
    border-bottom:1px solid #f1f3f5;cursor:pointer;
  }
  .file-item:active{background:#f5f8fc}
  .file-item.active{background:var(--blue-bg);box-shadow:inset 3px 0 0 var(--blue)}
  .fi-main{min-width:0;flex:1 1 auto}
  .fi-name{
    font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .fi-meta{font-size:11px;color:#8a9099;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{
    padding:22px 12px;text-align:center;color:#9aa0a8;font-size:12px;
  }
  /* 编辑区 */
  .edit-panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:#fff}
  .edit-head{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;
    border-bottom:1px solid #f0f2f5;
  }
  .name-input{
    flex:1 1 auto;min-width:0;padding:8px 10px;border:1px solid #d5dbe3;
    border-radius:var(--radius);font:500 15px/1.2 inherit;color:#222;background:#fff;
  }
  .name-input:disabled{background:#f6f7f9;color:#aaa}
  .state{flex:0 0 auto;font-size:11px;color:#999;white-space:nowrap}
  .state.dirty{color:#e67e22}
  .state.ok{color:var(--green)}
  textarea{
    flex:1 1 auto;min-height:110px;width:100%;border:0;outline:0;resize:none;
    padding:10px 12px;font:15px/1.7 "Microsoft YaHei",system-ui,sans-serif;
    color:#222;background:#fff;
  }
  textarea::placeholder{color:#b3b8bf}
  .edit-foot{
    flex:0 0 auto;display:flex;justify-content:space-between;gap:8px;
    padding:4px 12px;border-top:1px solid #f0f2f5;font-size:11px;color:#8a9099;
    background:#fafbfc;
  }
  /* 状态栏 */
  .status-bar{
    flex:0 0 auto;padding:6px 12px;font-size:12px;color:#666;background:#fff;
    border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  /* 提示 */
  #toast{
    position:fixed;left:50%;bottom:44px;transform:translate(-50%,8px);
    max-width:88vw;padding:9px 16px;border-radius:6px;background:rgba(28,32,38,.86);
    color:#fff;font-size:13px;line-height:1.4;text-align:center;pointer-events:none;
    opacity:0;transition:opacity .18s,transform .18s;z-index:100;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.error{background:rgba(190,50,40,.92)}
  #toast.success{background:rgba(30,132,73,.92)}
  /* 设置弹窗 */
  dialog{
    width:min(92vw,420px);padding:0;border:0;border-radius:8px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);color:#222;
  }
  dialog::backdrop{background:rgba(0,0,0,.38)}
  .dlg-body{padding:16px}
  .dlg-title{font-size:15px;font-weight:600;margin:0 0 12px}
  .dlg-row{margin-bottom:10px}
  .dlg-row label{display:block;font-size:12px;color:#666;margin-bottom:4px}
  .dlg-row input{
    width:100%;padding:8px 10px;border:1px solid #d5dbe3;border-radius:var(--radius);
    font:14px/1.2 inherit;background:#fff;
  }
  .dlg-row input[readonly]{background:#f5f6f8;color:#777}
  .dlg-hint{font-size:11px;color:#8a9099;line-height:1.6;margin-top:2px}
  .dlg-msg{
    font-size:13px;color:#444;line-height:1.7;white-space:pre-line;
    max-height:52vh;overflow:auto;word-break:break-word;
  }
  .dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;background:#fafbfc;border-top:1px solid var(--line)}
  .dlg-foot button{
    min-width:78px;min-height:38px;border:1px solid #cbd3dd;border-radius:var(--radius);
    background:#fff;font:600 13px/1 inherit;cursor:pointer;
  }
  .dlg-foot button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  @media (min-width:760px){
    .list-panel{flex-basis:30%}
    textarea{font-size:16px}
  }
</style>
</head>
<body>

<header class="top">
  <span class="logo">狐</span>
  <span class="title">Fox记事本</span>
  <div class="top-right">
    <span class="ver-badge" id="verBadge">网页版 v1.00</span>
    <button class="icon-btn" id="btnSettings" title="设置" aria-label="设置">⚙</button>
  </div>
</header>

<div class="toolbar">
  <button id="btnNew" type="button">新建</button>
  <button id="btnSave" type="button" class="primary">保存</button>
  <button id="btnRefresh" type="button">刷新</button>
  <button id="btnDelete" type="button" class="danger" disabled>删除</button>
</div>

<main>
  <section class="list-panel">
    <div class="panel-head"><span>文件列表</span><span class="count" id="listCount">—</span></div>
    <div class="file-list" id="fileList">
      <div class="empty">正在读取云端列表…</div>
    </div>
  </section>

  <section class="edit-panel">
    <div class="edit-head">
      <input id="fileName" class="name-input" type="text" placeholder="文件名（自动补 .txt）" disabled>
      <span class="state" id="fileState">未选择文件</span>
    </div>
    <textarea id="editor" placeholder="点击「新建」，或从上方列表选择一个文件开始编辑" spellcheck="false" disabled></textarea>
    <div class="edit-foot">
      <span id="charCount">0 字</span>
      <span id="editTime">—</span>
    </div>
  </section>
</main>

<div class="status-bar"><span id="statusText">就绪</span></div>
<div id="toast"></div>

<dialog id="settingsDlg">
  <div class="dlg-body">
    <h3 class="dlg-title">设置</h3>
    <div class="dlg-row">
      <label for="inUser">用户名</label>
      <input id="inUser" type="text" autocomplete="username" placeholder="请输入用户名">
    </div>
    <div class="dlg-row">
      <label for="inPass">密码</label>
      <input id="inPass" type="password" autocomplete="current-password" placeholder="请输入密码">
    </div>
    <div class="dlg-row">
      <label for="inDev">设备标识（只读）</label>
      <input id="inDev" type="text" readonly>
      <div class="dlg-hint">账号密码仅保存在本机浏览器 localStorage；文件正文不落本地，只存云端。</div>
    </div>
  </div>
  <div class="dlg-foot">
    <button id="btnDlgCancel" type="button">取消</button>
    <button id="btnDlgSave" type="button" class="primary">保存</button>
  </div>
</dialog>

<dialog id="confirmDlg">
  <div class="dlg-body">
    <h3 class="dlg-title">请确认</h3>
    <div id="confirmMsg" class="dlg-msg"></div>
  </div>
  <div class="dlg-foot">
    <button id="cfCancel" type="button">取消</button>
    <button id="cfOk" type="button" class="primary">确定</button>
  </div>
</dialog>

<script>
'use strict';
/* ================= 常量 ================= */
const APP_VER='1.00';
const SHEET='Fox记事本';
const PROXY='https://1408347752-dxgsap4qrj.ap-guangzhou.tencentscf.com';
const WEBHOOK='https://www.kdocs.cn/api/v3/ide/file/cbDG0BYEda3W/script/V2-6JlKZr50nGpgw7u2HJEIFy/sync_task';
const TRACE_NAME='使用痕迹.txt';
const LS={user:'foxnote_user',pass:'foxnote_pass',dev:'foxnote_device',ver:'foxnote_ver'};

/* ================= 版本与缓存（16.2） ================= */
(function checkVersionCache(){
  try{
    const old=localStorage.getItem(LS.ver);
    if(old && old!==APP_VER){
      const keep={};
      [LS.user,LS.pass,LS.dev].forEach(k=>{const v=localStorage.getItem(k);if(v!==null)keep[k]=v;});
      localStorage.clear();sessionStorage.clear();
      Object.keys(keep).forEach(k=>localStorage.setItem(k,keep[k]));
    }
    localStorage.setItem(LS.ver,APP_VER);
  }catch(e){}
})();
(async function pullLatestVersion(){
  try{
    if(sessionStorage.getItem('foxnote_reloaded')==='1')return;
    const res=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});
    const html=await res.text();
    const m=html.match(/name=["']网页版版本["']\s+content=["']([^"']+)["']/i);
    if(m && m[1] && m[1]!==APP_VER){
      sessionStorage.setItem('foxnote_reloaded','1');
      location.replace(location.pathname+'?_='+Date.now());
    }
  }catch(e){}
})();

/* ================= 基础工具 ================= */
const $=id=>document.getElementById(id);
function num(v){const n=parseInt(v,10);return isNaN(n)?0:n}
function countChars(s){return [...(s||'')].length}
function bjTime(d){
  const t=new Date((d?d.getTime():Date.now())+8*3600*1000);
  return t.toISOString().replace('T',' ').slice(0,19);
}
function shortTime(){const s=bjTime().slice(5,19).replace(/[-: ]/g,'');return s}
function genId(){return String(Math.floor(1000000000+Math.random()*9000000000))}
function deviceId(){
  let id=localStorage.getItem(LS.dev);
  if(!id){id='W'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);localStorage.setItem(LS.dev,id);}
  return id;
}
function creds(){
  return {
    u:localStorage.getItem(LS.user)||'',
    p:localStorage.getItem(LS.pass)||''
  };
}
let toastTimer=null;
function toast(msg,type){
  const el=$('toast');
  el.textContent=msg;
  el.className='show'+(type?' '+type:'');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{el.className=type||'';},2600);
}
function setStatus(msg){$('statusText').textContent=msg}

/* ================= 云端通道 ================= */
async function cloud(action,params){
  const c=creds();
  const argv=Object.assign({表格名:SHEET,操作:action,用户名:c.u,密码:c.p},params||{});
  const payload={webhookUrl:WEBHOOK,message:{Context:{argv:argv}}};
  const ctrl=new AbortController();
  const tid=setTimeout(()=>ctrl.abort(),30000);
  try{
    const res=await fetch(PROXY,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload),
      signal:ctrl.signal
    });
    clearTimeout(tid);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const j=await res.json();
    const r=(j&&j.data&&j.data.result)||j;
    if(!r||typeof r!=='object')return {status:'error',tongzhi:'云端返回格式异常'};
    return r;
  }catch(e){
    clearTimeout(tid);
    return {status:'error',tongzhi:'网络异常：'+(e.name==='AbortError'?'请求超时':e.message)};
  }
}
async function writeCloud(action,params){
  return cloud(action,Object.assign({},params||{},{锁登记处:deviceId()}));
}
async function unlock(){
  try{await cloud('解锁',{锁登记处:deviceId()});}catch(e){}
}
function needAuth(r){
  if(r&&r.需要认证){toast('账号或密码错误，请在设置里修改','error');openSettings();return true}
  return false;
}

/* ================= 页面状态 ================= */
let files=[];        // 云端索引（已过滤特殊文件）
let cur=null;        // 当前编辑文件 {id,name,s,e,isNewFile,saved,createTime,content}
let baseline='';     // 打开/保存时的内容基线，用于判断未保存
let busy=false;

function setBusy(v){
  busy=v;
  $('btnNew').disabled=v;
  $('btnRefresh').disabled=v;
  $('btnSave').disabled=v;
  $('btnDelete').disabled=v||!cur||(!cur.saved&&cur.isNewFile);
}

/* ================= 列表 ================= */
function renderList(){
  const box=$('fileList');
  $('listCount').textContent=files.length+' 个';
  if(!files.length){
    box.innerHTML='<div class="empty">暂无文件，点击上方「新建」开始</div>';
    return;
  }
  const frag=document.createDocumentFragment();
  for(const f of files){
    const item=document.createElement('div');
    item.className='file-item'+(cur&&cur.id===f.ID?' active':'');
    item.dataset.id=f.ID;
    const chars=f.内容字符数||'0';
    const time=String(f.最后编辑时间||f.同步时间||'').slice(0,16);
    item.innerHTML='<div class="fi-main"><div class="fi-name"></div><div class="fi-meta"></div></div>';
    item.querySelector('.fi-name').textContent=f.文件名||'(未命名)';
    item.querySelector('.fi-meta').textContent=chars+' 字 · '+(time||'—');
    item.addEventListener('click',()=>openFile(f.ID));
    frag.appendChild(item);
  }
  box.innerHTML='';
  box.appendChild(frag);
}

async function refreshIndex(){
  if(busy)return false;
  setBusy(true);
  setStatus('正在刷新云端列表…');
  try{
    const r=await cloud('读取索引');
    if(needAuth(r))return false;
    if(r.status!=='success'){
      toast(r.tongzhi||'刷新失败','error');
      setStatus('刷新失败：'+(r.tongzhi||'未知错误'));
      return false;
    }
    const map=new Map();
    for(const row of (r.数据||[])){
      const name=String(row.文件名||'').trim();
      if(!name)continue;
      if(name===TRACE_NAME||name==='使用痕迹')continue;
      if(String(row.状态||'')==='临时')continue;
      if(String(row.ID||'').slice(-3)==='_TL')continue;
      const prev=map.get(row.ID);
      if(!prev||num(row.起点号)>=num(prev.起点号))map.set(row.ID,row);
    }
    files=[...map.values()].sort((a,b)=>{
      const t=String(b.最后编辑时间||'').localeCompare(String(a.最后编辑时间||''));
      return t||String(a.文件名||'').localeCompare(String(b.文件名||''),'zh');
    });
    renderList();
    setStatus('列表已刷新：'+files.length+' 个文件');
    return true;
  }finally{
    setBusy(false);
  }
}

/* ================= 打开文件 ================= */
function mergeFileJson(rows){
  const parts=[];
  const list=[];
  for(const row of rows){
    let d=null;
    try{d=JSON.parse(row.文件JSON||'{}')}catch(e){}
    list.push({s:num(row.起点号),c:(d&&typeof d.内容==='string')?d.内容:''});
  }
  list.sort((a,b)=>a.s-b.s);
  for(const p of list){
    if(p.c==='')continue;
    if(parts.length&&parts[parts.length-1]===p.c)continue;
    parts.push(p.c);
  }
  return parts.join('');
}

async function openFile(id){
  if(busy)return;
  if(isDirty()&&!await uiConfirm('当前文件有未保存的修改，确定放弃并打开其他文件吗？','放弃修改'))return;
  setBusy(true);
  setStatus('正在读取文件…');
  try{
    const r=await cloud('查找',{列名:'ID',关键字:id});
    if(needAuth(r))return;
    if(r.status!=='success'||!r.匹配数){
      toast(r.tongzhi||'未找到该文件','error');
      setStatus('读取失败');
      return;
    }
    const rows=r.数据||[];
    const main=rows.slice().sort((a,b)=>num(b.起点号)-num(a.起点号))[0];
    const idx=files.find(x=>x.ID===id);
    cur={
      id:id,
      name:main.文件名||(idx&&idx.文件名)||'未命名.txt',
      s:num(main.起点号),
      e:num(main.终点号),
      isNewFile:false,
      saved:true,
      createTime:main.创建日期||'',
      content:mergeFileJson(rows)
    };
    baseline=cur.content;
    showCurrent();
    setStatus('已打开：'+cur.name);
  }finally{
    setBusy(false);
  }
}

function showCurrent(){
  const nameEl=$('fileName');
  const ed=$('editor');
  if(!cur){
    nameEl.value='';
    nameEl.disabled=true;
    ed.value='';
    ed.disabled=true;
    $('fileState').textContent='未选择文件';
    $('fileState').className='state';
    $('charCount').textContent='0 字';
    $('editTime').textContent='—';
    renderList();
    setBusy(false);
    return;
  }
  nameEl.value=cur.name;
  nameEl.disabled=false;
  ed.value=cur.content;
  ed.disabled=false;
  updateState();
  $('charCount').textContent=countChars(ed.value)+' 字';
  $('editTime').textContent=cur.isNewFile?'新建未保存':('v'+cur.s+' · '+(cur.lastEditTime||''));
  setBusy(false);
  renderList();
}
function isDirty(){return !!cur&&$('editor').value!==baseline}
function updateState(){
  const st=$('fileState');
  if(!cur){st.textContent='未选择文件';st.className='state';return}
  if(isDirty()){
    st.textContent=cur.isNewFile?'新建 · 未保存':'未保存';
    st.className='state dirty';
  }else{
    st.textContent=cur.isNewFile?'新建 · 待保存':'已同步 v'+cur.s;
    st.className=cur.isNewFile?'state dirty':'state ok';
  }
}

/* ================= 新建 ================= */
async function newFile(){
  if(busy)return;
  if(isDirty()&&!await uiConfirm('当前文件有未保存的修改，确定放弃并新建吗？','放弃修改'))return;
  const now=bjTime();
  const name='新建_'+shortTime()+'.txt';
  cur={id:genId(),name:name,s:0,e:0,isNewFile:true,saved:false,createTime:now,lastEditTime:now,content:''};
  baseline='';
  showCurrent();
  $('editor').focus();
  $('fileName').select();
  setStatus('已新建，输入内容后点「保存」上传');
  toast('新文件已创建，记得保存');
}

/* ================= 保存（两阶段提交） ================= */
function buildUploadData(name,content,S,E,createTime,now){
  return {
    '拥有者':'',
    'ID':cur.id,
    '文件名':name,
    '内容':content,
    '起点号':String(S),
    '终点号':String(E),
    '文件夹路径':'',
    '最后上传发起时间':now,
    '最后编辑时间':now,
    '同步时间':now,
    'MD5':'',
    '内容字符数':String(countChars(content)),
    '创建日期':createTime||now,
    '文件JSON':JSON.stringify({
      id:cur.id,name:name,内容:content,起点号:S,终点号:E,拥有者:'',
      文件夹路径:'',创建日期:createTime||now,最后编辑时间:now,内容字符数:countChars(content)
    })
  };
}

async function saveFile(){
  if(busy)return;
  if(!cur){toast('请先新建或选择一个文件','error');return}
  const nameRaw=$('fileName').value.trim();
  if(!nameRaw){toast('请填写文件名','error');$('fileName').focus();return}
  const name=/\.txt$/i.test(nameRaw)?nameRaw:nameRaw+'.txt';
  const content=$('editor').value;
  if(countChars(content)>20000){
    toast('超过 2 万字，网页版暂不支持保存','error');
    return;
  }
  const wasNew=cur.isNewFile&&!cur.saved;
  const S=wasNew?0:cur.s;
  const E=wasNew?1:cur.s+1;
  const now=bjTime();
  const createTime=cur.createTime||now;
  const data=buildUploadData(name,content,S,E,createTime,now);

  setBusy(true);
  setStatus('正在保存到云端…');
  try{
    const sub=await writeCloud('同步提交',{
      'ID':cur.id,
      '起点号':String(S),
      '终点号':String(E),
      '本地新文件标识':wasNew?'true':'false',
      '数据':data
    });
    if(needAuth(sub)){await unlock();return}
    if(sub.status!=='success'){
      await unlock();
      toast(sub.tongzhi||'保存失败','error');
      setStatus('保存失败：'+(sub.tongzhi||'未知错误'));
      return;
    }
    const judge=sub.判定结果;
    if(judge==='收为临时'){
      const newS=num(sub.终点号)||E;
      const conf=await writeCloud('转正确认',{'ID':cur.id,'起点号':String(newS)});
      if(conf.status==='success'&&(!conf.判定结果||conf.判定结果==='转正成功')){
        await unlock();
        await afterSaved(name,content,newS,createTime,now,wasNew?'新建':'保存');
        return;
      }
      await unlock();
      toast(conf.tongzhi||'转正确认失败','error');
      setStatus('保存失败：转正确认未通过');
      return;
    }
    if(judge==='全新接收'){
      const newS=num(sub.终点号)||E;
      await unlock();
      await afterSaved(name,content,newS,createTime,now,'新建');
      return;
    }
    if(judge==='无需上传'){
      await unlock();
      toast('内容无变化，无需上传');
      setStatus('无变化，未上传');
      return;
    }
    if(judge==='同步冲突'){
      const cloudVer=num(sub.云端版本号);
      await unlock();
      const ok=await uiConfirm('云端已更新（云端 v'+cloudVer+'，本地基于 v'+S+'）。\n是否用本地内容覆盖云端？','覆盖云端');
      if(ok){
        const fr=await writeCloud('强制覆盖云端',{'ID':cur.id,'强制终点号':String(E),'数据':data});
        await unlock();
        if(fr.status==='success'){
          await afterSaved(name,content,num(fr.终点号)||E,createTime,now,'保存');
          return;
        }
        toast(fr.tongzhi||'覆盖云端失败','error');
        setStatus('保存失败：覆盖云端失败');
      }else{
        setStatus('已取消保存，请刷新后打开云端版本');
      }
      return;
    }
    await unlock();
    toast(sub.tongzhi||('未知结果：'+judge),'error');
    setStatus('保存失败：'+(sub.tongzhi||'未知结果'));
  }finally{
    setBusy(false);
  }
}

async function afterSaved(name,content,ver,createTime,now,action){
  cur={
    id:cur.id,name:name,s:ver,e:ver,isNewFile:false,saved:true,
    createTime:createTime,lastEditTime:now,content:content
  };
  baseline=content;
  $('fileName').value=name;
  showCurrent();
  toast('已保存：'+name,'success');
  setStatus('保存成功（v'+ver+'），正在刷新列表…');
  await refreshIndex();
  await appendTrace(action,name,cur.id);
  setStatus('已保存并刷新：'+name);
}

/* ================= 使用痕迹（不显示在列表） ================= */
async function appendTrace(action,fileName,fileId){
  try{
    const line=JSON.stringify({t:bjTime(),端:'Web',动作:action,文件:fileName,id:fileId});
    const q=await cloud('查找',{列名:'文件名',关键字:TRACE_NAME});
    if(q.status!=='success')return;
    const now=bjTime();
    let id,S,E,oldContent,createTime,traceName=TRACE_NAME;
    if(q.匹配数>0&&q.数据&&q.数据[0]){
      const row=q.数据[0];
      let d=null;
      try{d=JSON.parse(row.文件JSON||'{}')}catch(e){}
      id=row.ID;
      S=num(row.起点号);
      E=S+1;
      oldContent=(d&&typeof d.内容==='string')?d.内容:'';
      createTime=row.创建日期||now;
      traceName=row.文件名||TRACE_NAME;
    }else{
      id=genId();S=0;E=1;oldContent='';createTime=now;
    }
    if(!id)return;
    const content=(oldContent?(oldContent.endsWith('\n')?oldContent:oldContent+'\n'):'')+line+'\n';
    const data={
      '拥有者':'','ID':id,'文件名':traceName,'内容':content,
      '起点号':String(S),'终点号':String(E),'文件夹路径':'',
      '最后上传发起时间':now,'最后编辑时间':now,'同步时间':now,'MD5':'',
      '内容字符数':String(countChars(content)),'创建日期':createTime,
      '文件JSON':JSON.stringify({
        id:id,name:traceName,内容:content,起点号:S,终点号:E,拥有者:'',
        文件夹路径:'',创建日期:createTime,最后编辑时间:now,内容字符数:countChars(content)
      })
    };
    const sub=await writeCloud('同步提交',{
      'ID':id,'起点号':String(S),'终点号':String(E),
      '本地新文件标识':(S===0?'true':'false'),'数据':data
    });
    if(sub.status==='success'){
      if(sub.判定结果==='收为临时'){
        const newS=num(sub.终点号)||E;
        await writeCloud('转正确认',{'ID':id,'起点号':String(newS)});
      }
    }
    await unlock();
  }catch(e){
    console.warn('痕迹写入失败（不影响主操作）',e);
    await unlock();
  }
}

/* ================= 删除 ================= */
async function deleteFile(){
  if(busy||!cur)return;
  if(cur.isNewFile&&!cur.saved){
    cur=null;baseline='';
    showCurrent();
    setStatus('已丢弃未保存的新文件');
    toast('已丢弃');
    return;
  }
  if(!await uiConfirm('确定删除「'+cur.name+'」？删除后不可恢复。','删除'))return;
  const delName=cur.name;
  const delId=cur.id;
  setBusy(true);
  setStatus('正在删除…');
  try{
    const r=await writeCloud('删除行',{'ID':delId});
    if(needAuth(r)){await unlock();return}
    await unlock();
    if(r.status!=='success'){
      toast(r.tongzhi||'删除失败','error');
      setStatus('删除失败：'+(r.tongzhi||'未知错误'));
      return;
    }
    cur=null;baseline='';
    showCurrent();
    toast('已删除：'+delName,'success');
    setStatus('删除成功，正在刷新列表…');
    await refreshIndex();
    await appendTrace('删除',delName,delId);
    setStatus('已删除并刷新：'+delName);
  }finally{
    setBusy(false);
  }
}

/* ================= 设置 ================= */
function openSettings(){
  const c=creds();
  $('inUser').value=c.u;
  $('inPass').value=c.p;
  $('inDev').value=deviceId();
  if(!$('settingsDlg').open)$('settingsDlg').showModal();
}
function saveSettings(){
  const u=$('inUser').value.trim();
  const p=$('inPass').value;
  if(!u||!p){toast('用户名和密码都要填','error');return}
  localStorage.setItem(LS.user,u);
  localStorage.setItem(LS.pass,p);
  $('settingsDlg').close();
  toast('设置已保存');
  refreshIndex();
}

/* ================= 确认弹窗（禁用浏览器原生 confirm） ================= */
function uiConfirm(msg,okText){
  return new Promise(resolve=>{
    const dlg=$('confirmDlg'),ok=$('cfOk'),no=$('cfCancel');
    let settled=false;
    const finish=v=>{
      if(settled)return;
      settled=true;
      if(dlg.open)dlg.close();
      ok.onclick=null;no.onclick=null;dlg.oncancel=null;
      resolve(v);
    };
    $('confirmMsg').textContent=msg;
    ok.textContent=okText||'确定';
    ok.onclick=()=>finish(true);
    no.onclick=()=>finish(false);
    dlg.oncancel=e=>{e.preventDefault();finish(false)};
    dlg.showModal();
  });
}

/* ================= 事件绑定与启动 ================= */
$('btnNew').addEventListener('click',newFile);
$('btnSave').addEventListener('click',saveFile);
$('btnRefresh').addEventListener('click',refreshIndex);
$('btnDelete').addEventListener('click',deleteFile);
$('btnSettings').addEventListener('click',openSettings);
$('btnDlgCancel').addEventListener('click',()=>$('settingsDlg').close());
$('btnDlgSave').addEventListener('click',saveSettings);

$('editor').addEventListener('input',()=>{
  if(!cur)return;
  updateState();
  $('charCount').textContent=countChars($('editor').value)+' 字';
});
$('fileName').addEventListener('input',()=>{if(cur)updateState()});
window.addEventListener('beforeunload',e=>{
  if(isDirty()){e.preventDefault();e.returnValue='';}
});

document.addEventListener('DOMContentLoaded',()=>{
  $('verBadge').textContent='网页版 v'+APP_VER;
  showCurrent();
  if(!creds().u||!creds().p){openSettings();}else{refreshIndex();}
});
