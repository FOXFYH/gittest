<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>看图器网页版</title>
<style>
:root{
  --bg:#12141a; --panel:#1c1f27; --line:#2c313d; --tx:#e8ecf3; --dim:#8b93a5;
  --blue:#4c8dff; --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--tx);
  font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  overscroll-behavior:none;touch-action:manipulation}
body{display:flex;flex-direction:column;height:100dvh}

/* ---------- 顶栏 ---------- */
#bar{display:flex;align-items:center;gap:8px;background:var(--panel);
  border-bottom:1px solid var(--line);padding:9px 10px;flex:0 0 auto}
#dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:0 0 auto}
#dot.on{background:var(--green)} #dot.mid{background:var(--amber)}
#stt{flex:1 1 auto;min-width:0;font-size:13px;overflow:hidden;white-space:nowrap;
  text-overflow:ellipsis}
#ver{color:var(--dim);font-size:11px;flex:0 0 auto}
/* ---------- 工具行 ---------- */
#tools{display:flex;gap:8px;padding:8px;flex:0 0 auto;align-items:center}
#path{flex:1 1 auto;min-width:0;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:9px 10px;font-size:12px;color:var(--dim);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
button{background:var(--panel);color:var(--tx);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;
  cursor:pointer;flex:0 0 auto}
button:active{background:#2a2f3c}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
/* ---------- 缩略图墙 ---------- */
#grid{flex:1 1 auto;overflow-y:auto;padding:0 8px 16px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  overflow:hidden;position:relative;cursor:pointer}
.cell.folder{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px}
.cell.folder .ic{font-size:34px}
.cell.folder .nm{font-size:11px;color:var(--dim);max-width:94%;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}
.cell .ph{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  color:#3a4152;font-size:22px}
.cell img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.cell .tag{position:absolute;left:4px;bottom:4px;right:4px;font-size:10px;
  color:#fff;background:rgba(0,0,0,.55);border-radius:6px;padding:1px 5px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#hint{grid-column:1/-1;color:var(--dim);font-size:13px;text-align:center;
  padding:36px 20px;line-height:1.9;white-space:pre-line}
/* ---------- 原图详情层 ---------- */
#view{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;
  flex-direction:column}
#view.on{display:flex}
#vbar{display:flex;align-items:center;gap:8px;padding:10px;flex:0 0 auto}
#vnm{flex:1 1 auto;min-width:0;font-size:13px;overflow:hidden;white-space:nowrap;
  text-overflow:ellipsis}
#vimg{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
#vimg img{max-width:100%;max-height:100%;object-fit:contain}
#vinfo{text-align:center;color:var(--dim);font-size:12px;padding:8px;flex:0 0 auto}
/* ---------- 密码门 ---------- */
#gate{position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;
  align-items:center;justify-content:center;padding:22px}
#gate .card{width:100%;max-width:360px;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:20px}
#gate h3{margin:0 0 6px;font-size:17px}
#gate p{margin:0 0 14px;color:var(--dim);font-size:12px;line-height:1.7}
#gate input{width:100%;background:#0f1116;border:1px solid var(--line);
  color:var(--tx);border-radius:9px;padding:12px;font-size:15px;
  font-family:inherit;margin-bottom:10px}
#gate .err{color:var(--red);font-size:12px;min-height:16px;margin-bottom:6px}
#gate .row{display:flex;gap:8px}
</style>
</head>
<body>

<div id="bar">
  <div id="dot"></div>
  <div id="stt">正在初始化…</div>
  <div id="ver"></div>
</div>

<div id="tools">
  <button id="b_up">上一级</button>
  <div id="path"></div>
  <button id="b_rf">刷新</button>
  <button id="b_pw">密码</button>
</div>

<div id="grid">
  <div id="hint">等待连接电脑端…</div>
</div>

<div id="view">
  <div id="vbar">
    <div id="vnm"></div>
    <button id="b_close">关闭</button>
  </div>
  <div id="vimg"><div id="vinfo"></div></div>
  <div id="vinfo2" style="display:none"></div>
</div>

<div id="gate">
  <div class="card">
    <h3>看图器网页版</h3>
    <p>远程查看电脑上看图器正在浏览的图片库。<br>
       需要输入电脑端设置的「频道密码」才能进入。</p>
    <input id="pwi" type="password" placeholder="输入频道密码…">
    <input id="nki" type="text" placeholder="本机昵称（可留空）…">
    <div class="err" id="pwe"></div>
    <div class="row">
      <button id="pok" class="pri" style="flex:1">进入</button>
    </div>
    <div id="myid" style="color:#8b93a5;font-size:11px;margin-top:10px"></div>
  </div>
</div>

<script>
/* ==========================================================================
   看图器网页版 · 手机客户端 v1.01（竖版）
   --------------------------------------------------------------------------
   本地看图器 = 服务器（走 PieSocket 免费中继）；本页 = 远程界面。
   身份（通用提示词 13.1）：本页有自己的【软件号】——随机 10 位（手机端 4xxxxxxxxx），
   存 localStorage 随设备持久化、固定不可改；每条外发消息都套 FOX 帧头（13.2）：
     【FOXID:<14位时间戳><8位随机><10位软件号>=cut(NNN/MMM)】<JSON正文>
   帧头自带发送者软件号——中继把本机请求回显回来时（发送者=自己）直接丢弃，
   多台手机同频道也不串台；正文带可选字段 nick（昵称），有则必报、有则必收。

   网页传输有节制（服务端承诺）：
     · 缩略图每张 ≤5KB，先进缩略图墙；
     · 原图 ≤100KB（超过的由电脑端先压缩），点开才提取；
     · 正文 >64KB 按 UTF-8 边界切多段（段间隔 0.2s），接收端拼装、60 秒空闲硬超时。

   协议（正文 JSON）：本页→电脑 hello/hb/dir/thumb/orig；电脑→本页 st/dir/th/og
   ========================================================================== */

const VER = '1.01';
const WS_URL_TMPL = ('wss://free.blr2.piesocket.com/v3/%s'
  + '?api_key=ReDFavhh0qnOCKUUjQiLKVZ9RdxA6e4BGVKxxNug');
const LS_PW = 'kantu_web_pw';      // 记住的频道密码
const LS_PATH = 'kantu_web_path';  // 记住的目录
const KA_SEC = 120;                // 本页心跳（业务消息极少，靠电脑端协议 ping 保活）
const RECONNECT = 3;

document.getElementById('ver').textContent = 'v' + VER;
document.title = '看图器网页版 v' + VER;

const el = {
  dot: document.getElementById('dot'),  stt: document.getElementById('stt'),
  path: document.getElementById('path'), grid: document.getElementById('grid'),
  hint: document.getElementById('hint'),
  view: document.getElementById('view'), vimg: document.getElementById('vimg'),
  vnm: document.getElementById('vnm'),
  gate: document.getElementById('gate'), pwi: document.getElementById('pwi'),
  pwe: document.getElementById('pwe'),
  nki: document.getElementById('nki'), myid: document.getElementById('myid')
};

/* ---------------- 身份（13.1 软件号：随机 10 位、随设备持久化、只读不可改） ---------------- */
const LS_MYID = 'kantu_my_id';      // 本机软件号（网页端取 4 开头，存 localStorage）
const LS_MYNICK = 'kantu_my_nick';  // 本机昵称（给人看的，可留空）
const _enc = new TextEncoder(), _dec = new TextDecoder('utf-8');
function ensureMyId(){
  let v = 0;
  try { v = parseInt(localStorage.getItem(LS_MYID) || '0', 10); } catch(e){}
  if (!v || String(v).length !== 10){
    v = 4000000000 + Math.floor(Math.random() * 1000000000);   // 手机端段：4xxxxxxxxx
    try { localStorage.setItem(LS_MYID, String(v)); } catch(e){}
  }
  return v;
}
let MYID = ensureMyId();
let MYNICK = lsGet(LS_MYNICK, '') || '手机';
let peerId = 0, peerNick = '';      // 电脑端身份（13.1 有则必收）

function setDot(cls, text){
  el.dot.className = cls || '';
  if (text != null) el.stt.textContent = text;
}

/* ---------------- 密码门 ---------------- */
function pwGet(){
  try { return (localStorage.getItem(LS_PW) || '').trim(); } catch(e){ return ''; }
}
function pwSet(p){ try { localStorage.setItem(LS_PW, p); } catch(e){} }

document.getElementById('pok').onclick = enter;
el.pwi.addEventListener('keydown', function(e){ if (e.key === 'Enter') enter(); });
el.nki.value = lsGet(LS_MYNICK, '');     // 回填本机昵称
el.myid.textContent = '本机软件号：' + MYID + '（身份标识，固定不可改）';
function enter(){
  const p = el.pwi.value.replace(/\s/g, '');
  if (!p){ el.pwe.textContent = '密码不能为空'; return; }
  pwSet(p);
  MYNICK = (el.nki.value || '').trim().slice(0, 40);
  lsSet(LS_MYNICK, MYNICK);
  el.gate.style.display = 'none';
  lastDir = '';
  connect(true);        // 用户点「进入」＝强制按最新密码重连
}

/* ---------------- 连接 ---------------- */
let ws = null, connected = false, kaT = null, rcT = null;
let helloAcked = false, ackT = null, helloRetryT = null, helloNonce = 0;
let connecting = false, 连接段 = 0;      // 防重复连接：同一时刻只允许一条在连/已连

/* 严格握手：hello 带本次随机 nonce，只有服务端原样回带该 nonce 才算真连上 */
function helloStart(){
  helloNonce = Math.floor(Math.random() * 1e9);
  helloAcked = false;
  send({t:'hello', n: helloNonce});
  clearTimeout(ackT);
  ackT = setTimeout(function(){
    if (!helloAcked) setDot('',
      '未连上电脑端：等不到应答。请确认电脑上的看图器已打开、设置页里网页版已开启，且密码一致');
  }, 6000);
  clearInterval(helloRetryT);
  helloRetryT = setInterval(function(){
    if (helloAcked || !ws || ws.readyState !== 1){
      clearInterval(helloRetryT); helloRetryT = null; return;
    }
    send({t:'hello', n: helloNonce});          // 没应答就继续敲门
  }, 5000);
}
function peerLabel(){
  if (peerNick && peerId) return peerNick + '（' + peerId + '）';
  if (peerId) return '软件号 ' + peerId;
  return '';
}
function helloDone(msg){
  helloAcked = true;
  clearTimeout(ackT);
  clearInterval(helloRetryT); helloRetryT = null;
  const w = peerLabel();
  setDot('on', (msg || '已连上电脑端') + (w ? ' · ' + w : ''));
}
let lastDir = '', lastRxAt = 0, reqThumbs = new Set();

function connect(强制){
  // 同一时刻只允许一条连接：已在连/已连就别再开第二条（否则请求翻倍、目录乱跳）
  if (!强制){
    if (connecting) return;
    if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  }
  const my = ++连接段;
  try { if (ws) { ws.onclose = null; ws.close(); } } catch(e){}
  ws = null; connected = false;
  const pw = pwGet();
  if (!pw){ el.gate.style.display = 'flex'; return; }
  setDot('mid', '正在连接电脑端…');
  let sock;
  try { sock = new WebSocket(WS_URL_TMPL.replace('%s', 'kantu' + pw)); }
  catch(e){ setDot('', '连接失败：' + e.message); return; }
  connecting = true;
  sock.onopen = function(){
    if (my !== 连接段){ try{ sock.close(); }catch(e){} return; }   // 已被更新的连接取代
    ws = sock; connected = true; connecting = false;
    setDot('mid', '已进频道，等电脑端应答…');
    helloStart();
    startKA();
    send({t:'dir', p: lastDir || lsGet(LS_PATH, '')});
  };
  sock.onmessage = function(ev){
    if (my !== 连接段) return;
    lastRxAt = Date.now();
    handleRaw(ev.data);
  };
  sock.onclose = function(){
    if (my !== 连接段) return;
    connecting = false;
    connected = false; ws = null; stopKA();
    helloAcked = false;
    clearTimeout(ackT); clearInterval(helloRetryT); helloRetryT = null;
    setDot('', '连接断开，' + RECONNECT + ' 秒后重连…');
    clearTimeout(rcT);
    rcT = setTimeout(connect, RECONNECT * 1000);
  };
  sock.onerror = function(){};
}
/* ---------------- FOX 组帧（13.2：帧头自带 10 位软件号） ---------------- */
const FOX_MAX = 65479;              // 单段正文上限（FOX 规范）
function midGen(){
  const d = new Date(), p2 = n => String(n).padStart(2, '0');
  const ts = '' + d.getFullYear() + p2(d.getMonth()+1) + p2(d.getDate())
           + p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds());
  let r = '';
  for (let i = 0; i < 8; i++) r += String.fromCharCode(97 + Math.floor(Math.random()*26));
  return ts + r;
}
function foxSegs(text){              // 按 UTF-8 字节切，绝不切坏多字节字符
  const b = _enc.encode(text);
  if (b.length <= FOX_MAX) return [text];
  const out = []; let i = 0;
  while (i < b.length){
    let end = Math.min(i + FOX_MAX, b.length);
    while (end < b.length && (b[end] & 0xC0) === 0x80) end--;   // 回退到字符边界
    out.push(_dec.decode(b.subarray(i, end)));
    i = end;
  }
  return out;
}
function p3(n){ return String(n).padStart(3, '0'); }
function foxSend(text){
  const segs = foxSegs(text);
  if (segs.length > 999) return false;                 // 规范上限，超了不发
  const mid = midGen();
  for (let i = 0; i < segs.length; i++){
    const frame = '【FOXID:' + mid + String(MYID).padStart(10, '0')
                + '=cut(' + p3(i+1) + '/' + p3(segs.length) + ')】' + segs[i];
    const delay = i * 200;                             // 段间隔 ≥0.2s（首段 0）
    if (delay === 0){ try{ ws.send(frame); }catch(e){} }
    else setTimeout(function(){ try{ ws.send(frame); }catch(e){} }, delay);
  }
  return true;
}
function send(o){
  if (!ws || ws.readyState !== 1) return false;
  o.sid = MYID;                     // 13.1【有则必报】：正文里也报一次软件号
  if (MYNICK) o.nick = MYNICK;      // 昵称走可选字段（不改帧头格式）
  try { return foxSend(JSON.stringify(o)); } catch(e){ return false; }
}
function startKA(){ stopKA(); kaT = setInterval(function(){ send({t:'hb'}); }, KA_SEC*1000); }
function stopKA(){ if (kaT) { clearInterval(kaT); kaT = null; } }
function lsGet(k, d){ try { return localStorage.getItem(k) || d; } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

/* ---------------- FOX 拆帧 + 多段拼装（60 秒空闲硬超时） ---------------- */
const FOX_FRAG = {};                // (发送者|mid) -> {n, parts:{}, ts}
function foxParse(raw){
  if (typeof raw !== 'string' || raw.slice(0, 7) !== '【FOXID:' || raw.length < 53) return null;
  const head = raw.slice(0, 53);
  const sender = parseInt(head.slice(29, 39), 10);
  const mid    = head.slice(7, 29);
  const idx    = parseInt(head.slice(44, 47), 10);
  const tot    = parseInt(head.slice(48, 51), 10);
  if (!isFinite(sender) || !isFinite(idx) || !isFinite(tot)) return null;
  if (sender === MYID) return null;              // 中继把本机请求回显回来了——丢
  peerId = sender;                               // 13.1【有则必收】
  const body = raw.slice(53);
  if (tot <= 1) return body;
  const now = Date.now();
  for (const k in FOX_FRAG){
    if (now - FOX_FRAG[k].ts > 60000){           // 空闲硬超时：宣告失败、清缓冲
      const e = FOX_FRAG[k]; delete FOX_FRAG[k];
      setDot('', '长消息接收超时宣告失败：ID=' + mid + '（收到 '
             + Object.keys(e.parts).length + '/' + e.n + ' 段）');
    }
  }
  const key = sender + '|' + mid;
  const e = FOX_FRAG[key] || (FOX_FRAG[key] = {n: tot, parts: {}, ts: now});
  e.parts[idx] = body; e.ts = now;
  if (Object.keys(e.parts).length < e.n) return null;
  delete FOX_FRAG[key];
  let full = '';
  for (let i = 1; i <= e.n; i++){ if (typeof e.parts[i] !== 'string') return null; full += e.parts[i]; }
  return full;
}
function handleRaw(raw){
  const body = foxParse(raw);                    // 非 FOX / 自己的回显 → null
  if (body == null) return;
  let m;
  try { m = JSON.parse(body); } catch(e){ return; }
  if (!m || typeof m !== 'object') return;
  if (m.nick) peerNick = String(m.nick).slice(0, 40);   // 13.1：能显示就显示
  handleMsg(m);
}

/* ---------------- 消息处理 ---------------- */
function handleMsg(m){
  if (m.t === 'st'){
    // 严格：带口令的应答必须是本次握手那一发，别人的应答一律不算
    if (m.n != null && m.n !== helloNonce) return;
    if (m.v === 'err'){ helloDone(m.msg || '电脑端提示'); }
    else { helloDone(m.msg); }
    return;
  }
  if (m.t === 'dir'){
    if (typeof m.root !== 'string' || !Array.isArray(m.folders)) return;
    renderDir(m);
    return;
  }
  if (m.t === 'th'){
    if (!m.img) return;
    const rec = cellMap.get(cellKey(m.p, m.f));
    if (rec && rec.img) rec.img.src = 'data:image/jpeg;base64,' + m.img;
    return;
  }
  if (m.t === 'og'){
    if (!m.img) return;
    showOrig(m);
    return;
  }
}

/* ---------------- 目录渲染 ---------------- */
let observer = null;
const cellMap = new Map();     // key -> {img, path, file}
function cellKey(p, f){ return (p || '') + '|' + f; }

function renderDir(m){
  lastDir = m.p || '';
  lsSet(LS_PATH, lastDir);
  el.path.textContent = (m.root || '电脑端') + (lastDir ? ' / ' + lastDir : ' /（根目录）');
  el.grid.innerHTML = '';
  cellMap.clear();
  reqThumbs.clear();

  if (lastDir){                       // 除根目录外，放一张"上一级"卡片
    const up = document.createElement('div');
    up.className = 'cell folder';
    up.innerHTML = '<div class="ic">↩️</div><div class="nm">上一级</div>';
    up.onclick = function(){ goUp(); };
    el.grid.appendChild(up);
  }
  (m.folders || []).forEach(function(name){
    const c = document.createElement('div');
    c.className = 'cell folder';
    c.innerHTML = '<div class="ic">📁</div><div class="nm"></div>';
    c.querySelector('.nm').textContent = name;
    c.onclick = function(){ send({t:'dir', p: joinPath(lastDir, name)}); };
    el.grid.appendChild(c);
  });

  const imgs = m.imgs || [];
  if (!imgs.length && !(m.folders || []).length && !lastDir){
    el.hint = mkHint('这个文件夹里没有图片，也没有子文件夹');
    return;
  }
  imgs.forEach(function(it){
    const c = document.createElement('div');
    c.className = 'cell';
    c.dataset.th = cellKey(lastDir, it.f);
    c.innerHTML = '<div class="ph">🖼️</div><img alt="" style="display:none">' +
                  '<div class="tag"></div>';
    c.querySelector('.tag').textContent = it.f;
    const rec = {p: lastDir, f: it.f,
                 img: c.querySelector('img'), cell: c};
    cellMap.set(c.dataset.th, rec);
    rec.img.onload = function(){ rec.img.style.display = ''; };
    c.onclick = function(){ askOrig(rec.p, rec.f); };
    el.grid.appendChild(c);
  });
  if (m.trunc){
    el.grid.appendChild(mkHint('（这个文件夹图片太多，只显示了前 ' + imgs.length + ' 张）'));
  }
  if (!imgs.length && !(m.folders || []).length){
    el.grid.appendChild(mkHint('（空文件夹）'));
  }
  lazyObserve();
}
function mkHint(text){
  const d = document.createElement('div');
  d.id = 'hint'; d.textContent = text;
  return d;
}

function joinPath(dir, name){
  return dir ? dir + '/' + name : name;
}
function goUp(){
  if (!lastDir){ return; }
  const i = lastDir.lastIndexOf('/');
  send({t:'dir', p: i < 0 ? '' : lastDir.slice(0, i)});
}

/* 懒加载：滚到可见才要缩略图（省流量） */
function lazyObserve(){
  if (observer){ observer.disconnect(); }
  if (!('IntersectionObserver' in window)){ askAllThumbs(); return; }
  observer = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (!en.isIntersecting) return;
      const cell = en.target;
      observer.unobserve(cell);
      askThumb(cell);
    });
  }, {root: el.grid, rootMargin: '220px'});
  el.grid.querySelectorAll('.cell[data-th]').forEach(function(c){
    observer.observe(c);
  });
}
function askAllThumbs(){
  el.grid.querySelectorAll('.cell[data-th]').forEach(askThumb);
}
function askThumb(cell){
  const rec = cellMap.get(cell.dataset.th);
  if (!rec || reqThumbs.has(cell.dataset.th)) return;
  reqThumbs.add(cell.dataset.th);
  send({t:'thumb', p: rec.p, f: rec.f});
}

/* ---------------- 原图详情 ---------------- */
let vBusy = false;
function askOrig(p, f){
  if (vBusy) return;
  vBusy = true;
  el.view.classList.add('on');
  el.vnm.textContent = f;
  el.vimg.innerHTML = '<div id="vinfo">正在提取原图（≤100KB）…</div>';
  send({t:'orig', p: p, f: f});
}
function showOrig(m){
  const info = document.getElementById('vinfo');
  if (info && info.parentNode === el.vimg){
    el.vimg.innerHTML = '';
    const img = document.createElement('img');
    img.src = 'data:' + (m.mime || 'image/jpeg') + ';base64,' + m.img;
    el.vimg.appendChild(img);
    const kb = (m.bytes / 1024).toFixed(1);
    el.vnm.textContent = m.f + '（' + kb + ' KB）';
  }
  vBusy = false;
}
document.getElementById('b_close').onclick = function(){
  el.view.classList.remove('on');
  vBusy = false;
};

/* ---------------- 工具按钮 ---------------- */
document.getElementById('b_up').onclick = goUp;
document.getElementById('b_rf').onclick = function(){
  if (connected) send({t:'dir', p: lastDir});
};
document.getElementById('b_pw').onclick = function(){
  el.gate.style.display = 'flex';
  el.pwi.value = pwGet();
  el.pwe.textContent = '';
};

/* 断线提示 */
setInterval(function(){
  if (!connected) return;
  if (lastRxAt && Date.now() - lastRxAt > 90000){
    setDot('mid', '长时间没收到电脑端消息，可点「刷新」试试');
  }
}, 15000);

window.addEventListener('pageshow', function(){ connect(); });
window.addEventListener('focus', function(){ if (pwGet()) connect(); });

/* 初始：有记住的密码就直接连（并收起密码门），否则弹密码门 */
if (pwGet()){
  el.pwi.value = pwGet();
  el.gate.style.display = 'none';
  connect();
} else {
  el.gate.style.display = 'flex';
}
</script>
